/* YEET design tokens. Dark first. The copy the site serves is apps/landing/tokens.css; edit here, then copy. */
:root {
  color-scheme: dark;

  /* ground */
  --ink-950: #06071C;
  --ink-900: #0A0C2B;
  --ink: #0F1240;
  --ink-700: #181D5E;
  --ink-600: #232A7A;
  --blue: #2430FF;
  --blue-deep: #1820C4;
  --blue-lift: #4A55FF;

  /* brand: the logo, XP, highlights */
  --yellow: #FFE03A;
  --yellow-lift: #FFEE78;
  --yellow-deep: #F2C200;

  /* the two actions */
  --yeet: #22E27A;
  --yeet-lift: #8AF7B6;
  --yeet-deep: #0FB95C;
  --skeet: #FF4D8D;
  --skeet-lift: #FF88B4;
  --skeet-deep: #EE2E77;

  /* text and lines on dark */
  --text: #F4F5FF;
  --muted: #A9AEDD;
  --dim: #6E74B2;
  --line: rgba(255, 255, 255, .12);
  --line-strong: rgba(255, 255, 255, .22);
  --surface: rgba(15, 18, 64, .72);
  --surface-solid: #12164C;

  /* light surfaces (cards inside ChatGPT, print) */
  --paper: #FFFFFF;
  --sky: #EEF0FF;
  --line-light: #DADDF5;
  --muted-light: #5A5E8A;

  /* the light sheet on the site: ink text on paper, blue for the one highlighted word */
  --text-light: #0F1240;
  --accent-light: #2430FF;
  --accent-light-soft: rgba(36, 48, 255, .1);
  --surface-light: #F6F7FF;
  --line-light-strong: #B9BEEA;
  --shadow-light: 0 22px 44px -26px rgba(15, 18, 64, .38);
  --shadow-sheet: 0 -22px 60px -18px rgba(2, 3, 20, .7);
  --r-sheet: clamp(28px, 4.5vw, 48px);

  /* price moves */
  --up: #22E27A;
  --down: #FF6B8F;

  /* coin chips */
  --coin-1: #FFB238;
  --coin-2: #F27BB3;
  --coin-3: #9C84FF;
  --coin-4: #38D1C0;
  --coin-5: #E3A86B;

  /* type */
  --font-display: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --text-hero: clamp(2.75rem, 15vw, 8.25rem);
  --text-h2: clamp(2rem, 8.6vw, 4rem);
  --text-h3: 1.25rem;
  --text-body: 1.0625rem;
  --text-small: .875rem;
  --leading-display: .9;
  --leading-body: 1.5;

  /* shape */
  --r-chip: 999px;
  --r-btn: 18px;
  --r-card: 22px;
  --r-tile: 28px;

  /* depth: soft, never a hard offset */
  --shadow-card: 0 20px 44px -24px rgba(2, 3, 20, .8);
  --shadow-pop: 0 28px 60px -20px rgba(2, 3, 20, .85);
  --glow-yeet: rgba(34, 226, 122, .55);
  --glow-skeet: rgba(255, 77, 141, .55);
  --glow-yellow: rgba(255, 224, 58, .45);

  /* motion */
  --dur-press: 120ms;
  --dur-out: 420ms;
  --dur-in: 760ms;
  --dur-glint: 850ms;
  --dur-edge: 9s;
  --dur-breathe: 4.8s;
  --dur-stretch: 5.2s;
  --dur-drift: 22s;
  --stagger: 70ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in: cubic-bezier(.6, 0, .9, .4);
  --ease-settle: cubic-bezier(.3, 1.25, .5, 1);
  --ease-glint: cubic-bezier(.45, 0, .2, 1);

  /* buttons: flat fill, no border; a thin light runs part of the edge every 5 to 11 s */
  --btn-shadow: 0 8px 22px -14px rgba(2, 3, 20, .5);
  --btn-shimmer: rgba(255, 255, 255, .95);
  --dur-btn-shimmer: 1.7s;
}

/* number pulse: dollar values only, never percentages. Set --pulse from the size of the change:
   1 + min(.18, .04 + |change| / value). Re-add the class to fire it again. */
.num-pulse { display: inline-block; animation: numPulse .5s var(--ease-out); }
@keyframes numPulse { 0% { transform: scale(var(--pulse, 1.08)); filter: brightness(1.5); } 100% { transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { .num-pulse { animation: none; } }
/* YEET cards: the ChatGPT components of the round-3 Marlin entry (yeet-brand-entries/yeet-brand3-marlin, "In ChatGPT"),
   ported verbatim: tokens, sizes, spacing and colours are Marlin's. Changes, all for scroll performance inside the chat
   (docs: scroll-jank review 2026-11-13): the border run, the glow, the sheen and the shimmer play once on entrance or on
   a press instead of forever; the trade wire moves by transform; no @property loop, no backdrop-filter.
   The theme follows the host: body.gpt[data-theme] is set from window.openai.theme or the host context of the apps bridge.
   Fonts are Bricolage Grotesque and Geist Mono, subset and inlined (src/fonts.css); nothing loads from the network. */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --night:#09071C; --night-2:#131032; --night-3:#1D1947; --night-4:#2A2560;
  --volt:#E5FF3C; --volt-2:#CFEA1F;
  --ultra:#6A48FF; --ultra-2:#8E77FF; --ultra-3:#4A2BE0;
  --cloud:#F4F2FF; --cloud-2:#E6E2FA; --cloud-3:#D3CDF2;
  --mint:#2EF0A6; --rose:#FF5C8A; --ember:#FF8A3D;
  --fog:#9C98C8; --slate:#5F5A8C;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.5,0,.75,0); --spring:cubic-bezier(.34,1.56,.64,1);
  --ax:-60px; --ay:24px;
  --disp:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip}
body{margin:0;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
p{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
/* The card's frame in the chat: the host's own background around Marlin's card. */
main{position:relative;padding:calc(2px + var(--host-top,0px)) calc(2px + var(--host-right,0px)) calc(20px + var(--host-bottom,0px)) calc(2px + var(--host-left,0px))}

/* ---------- motion primitives (Marlin) ---------- */
@keyframes arrive{
  0%{opacity:0;transform:translate3d(var(--ax),var(--ay),0);animation-timing-function:cubic-bezier(.12,.8,.3,1)}
  56%{opacity:1;transform:translate3d(0,var(--ay),0);animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  100%{opacity:1;transform:none}
}
@keyframes leave{to{opacity:0;transform:translate3d(56px,-16px,0)}}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0% 0}}
@keyframes spinA{to{--a:360deg}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes flick{0%,86%,100%{opacity:1;transform:none}88%{opacity:.35;transform:scale(.9) rotate(-6deg)}90%{opacity:1;transform:scale(1.18) rotate(4deg)}92%{opacity:.5}94%{opacity:1;transform:scale(1.05)}}
@keyframes aim{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(90deg) scale(1.12)}94%{transform:rotate(80deg)}}
@keyframes sheen{0%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes glowY{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -.14em 0 rgba(0,0,0,.14),0 .5em 1.6em -.5em rgba(229,255,60,.55)}50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -.14em 0 rgba(0,0,0,.14),0 .6em 2.4em -.3em rgba(229,255,60,.85)}}
@keyframes glowU{0%,100%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -.14em 0 rgba(0,0,0,.22),0 .5em 1.6em -.5em rgba(106,72,255,.6)}50%{box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -.14em 0 rgba(0,0,0,.22),0 .6em 2.4em -.3em rgba(142,119,255,.95)}}
@keyframes pu{0%{transform:scale(1)}30%{transform:scale(1.16);color:var(--mint);text-shadow:0 0 18px rgba(46,240,166,.6)}100%{transform:scale(1)}}
@keyframes pd{0%{transform:scale(1)}30%{transform:scale(1.16);color:var(--rose);text-shadow:0 0 18px rgba(255,92,138,.55)}100%{transform:scale(1)}}
@keyframes pz{0%{transform:scale(1)}30%{transform:scale(1.14);text-shadow:0 0 16px currentColor}100%{transform:scale(1)}}
@keyframes land{0%{transform:scale(1.42);filter:brightness(1.6)}45%{transform:scale(.94)}72%{transform:scale(1.05)}100%{transform:scale(1);filter:none}}
@keyframes wind{0%{transform:scale(.82) rotate(-2deg)}50%{transform:scale(.9) rotate(2deg)}100%{transform:scale(.97) rotate(-1deg)}}
@keyframes chg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes runOnce{0%{opacity:1}80%{opacity:1}100%{opacity:0}}

.ar{opacity:0}
.ar.in{animation:arrive .95s var(--d,0ms) both}
.pu{animation:pu .7s var(--ease-out)}
.pd{animation:pd .7s var(--ease-out)}
.pz{animation:pz .6s var(--ease-out)}
.num{display:inline-block;transform-origin:50% 60%}
.winding{animation:wind .14s linear infinite alternate}
.land{animation:land .75s var(--ease-out)}

/* Shimmer on text: one pass on entrance. */
.shim{background:linear-gradient(100deg,var(--s1,var(--fog)) 0 40%,var(--s2,#fff) 50%,var(--s1,var(--fog)) 60% 100%);background-size:300% 100%;background-position:0% 0;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim var(--sd,1.6s) ease-in-out .5s both}

/* border run: a bright arc that travels the edge, once on entrance and once on a press */
.run{position:relative}
.run::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--rw,2.5px);pointer-events:none;z-index:2;opacity:0;
  background:conic-gradient(from var(--a),transparent 0 200deg,var(--r1b,#fff) 300deg,var(--r2,var(--volt)) 336deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.in .run::before,.ar.in.run::before,.run.again::before{animation:spinA var(--rs,2.6s) linear .9s 1,runOnce var(--rs,2.6s) linear .9s 1}
.run.again::before{animation-delay:0s}

/* ---------- buttons (Marlin) ---------- */
.btn{--fs:20px;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.4em;height:2.15em;padding:0 .85em;border:0;border-radius:.52em;cursor:pointer;
  font-family:var(--disp);font-weight:800;font-stretch:75%;font-size:var(--fs);line-height:1;letter-spacing:.03em;text-decoration:none;isolation:isolate;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;white-space:nowrap;
  transition:transform .3s var(--spring),filter .2s,opacity .2s}
.btn .bl{display:inline-flex;align-items:baseline;gap:.1em;position:relative;z-index:3}
.btn .ic{width:.66em;height:.8em;flex:none;transform-origin:50% 60%}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;
  background:linear-gradient(104deg,transparent 38%,rgba(255,255,255,.72) 49%,rgba(255,255,255,.0) 60%) no-repeat;background-size:260% 100%;background-position:160% 0;mix-blend-mode:soft-light}
.in .btn::after,.ar.in .btn::after{animation:sheen 1.2s ease-in-out .7s 1}
.btn:active{transform:scale(.94);transition-duration:.08s}
.btn:focus-visible{outline:3px solid var(--yc-fg);outline-offset:4px}
.yeet{background:var(--volt);color:var(--night);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 0 -.14em 0 rgba(0,0,0,.14),0 .5em 1.6em -.5em rgba(229,255,60,.55);--r1b:#fff;--r2:var(--ultra);--rw:3px}
.in .yeet,.ar.in .yeet{animation:glowY 2.8s ease-in-out .4s 1}
.yeet::after{mix-blend-mode:normal;background-image:linear-gradient(104deg,transparent 38%,rgba(255,255,255,.75) 49%,transparent 60%)}
.skeet{background:var(--ultra);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 -.14em 0 rgba(0,0,0,.22),0 .5em 1.6em -.5em rgba(106,72,255,.6);--r1b:#fff;--r2:var(--volt);--rw:3px}
.in .skeet,.ar.in .skeet{animation:glowU 2.8s ease-in-out .4s 1}
.skeet::after{mix-blend-mode:normal;background-image:linear-gradient(104deg,transparent 38%,rgba(255,255,255,.38) 49%,transparent 60%)}
/* The one call to action on a card keeps Marlin's beat and its icon's flick (transform and opacity only). */
.btn.cta .bl{animation:beat 2.6s ease-in-out infinite}
.btn.cta.yeet .ic{animation:flick 3.9s infinite}
.btn.cta.skeet .ic{animation:aim 3.9s 1.2s infinite}
.btn.lg{--fs:30px}.btn.md{--fs:24px}.btn.sm{--fs:17px;height:2.2em;border-radius:.6em}.btn.xs{--fs:14px;height:2.2em;padding:0 .8em;border-radius:.7em}
.btn.wide{width:100%}
.btn.ink{background:var(--night);color:var(--cloud);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);animation:none;letter-spacing:.01em}
.btn.ink::after{mix-blend-mode:normal;background-image:linear-gradient(104deg,transparent 38%,rgba(255,255,255,.18) 49%,transparent 60%)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor;animation:none}
.btn.ghost::after{display:none}
.btn .chgbar{position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.55);transform-origin:0 50%;transform:scaleX(0);z-index:2;mix-blend-mode:overlay}
.btn.charging .chgbar{animation:chg 1.3s cubic-bezier(.6,.05,.4,1) forwards}
.btn.charging .ic{animation:flick .35s infinite}
.btn.charging .bl{animation:beat .3s infinite}
.btn[disabled]{cursor:default}
.btn.spent{background:var(--night);color:var(--volt);animation:none;box-shadow:inset 0 0 0 1.5px rgba(229,255,60,.35)}
.btn.spent::before{opacity:0}
.btn.spent .bl,.btn.spent .ic,.btn.spent::after{animation:none}
.btn.okb{background:var(--mint);color:#06291C;animation:none}
.btn.okb::after{display:none}
.gpt[data-theme=light] .yeet{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -.14em 0 rgba(0,0,0,.12),0 .4em 1em -.5em rgba(90,100,0,.45)}
.gpt[data-theme=light] .in .yeet,.gpt[data-theme=light] .ar.in .yeet{animation:glowYL 2.8s ease-in-out .4s 1}
@keyframes glowYL{0%,100%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -.14em 0 rgba(0,0,0,.12),0 .4em 1em -.5em rgba(90,100,0,.45)}50%{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -.14em 0 rgba(0,0,0,.12),0 .5em 1.4em -.4em rgba(106,72,255,.45)}}
/* A button that can't act yet: still, dimmed. */
.btn[disabled]:not(.spent):not(.okb):not(.charging):not(.signing){opacity:.42;filter:saturate(.55)}
.btn[disabled] .bl,.btn[disabled]:not(.charging) .ic{animation:none}
/* The wallet asks for the user's confirmation: the button holds, the bolt waits. */
.btn.signing{background:var(--night);color:var(--volt);box-shadow:inset 0 0 0 1.5px var(--volt);animation:none}
.btn.signing::after{display:none}
.btn.signing .ic{animation:flick 1.3s infinite}
.gpt[data-theme=light] .btn.signing,.gpt[data-theme=light] .btn.spent{background:var(--yc-raise);color:var(--ultra);box-shadow:inset 0 0 0 1.5px var(--ultra)}

/* ---------- CHAT VIEW (Marlin): the host and card tokens, dark first ---------- */
.gpt{--g-bg:#212121;--g-fg:#ECECEC;--g-mute:#A6A6A6;--g-bub:#303030;--g-line:rgba(255,255,255,.1);--g-side:#171717;
  --yc-bg:#100D29;--yc-fg:#F4F2FF;--yc-mute:#9C98C8;--yc-line:rgba(255,255,255,.08);--yc-raise:#1A1640;--yc-btn:#252055;--yc-accent:var(--volt);--yc-ultra:var(--ultra-2);
  background:var(--g-bg);color:var(--g-fg);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .4s,color .4s}
.gpt[data-theme=light]{--g-bg:#FFFFFF;--g-fg:#0D0D0D;--g-mute:#6B6B6B;--g-bub:#F1F1F1;--g-line:#E5E5E5;--g-side:#F9F9F9;
  --yc-bg:#FFFFFF;--yc-fg:#09071C;--yc-mute:#6A6690;--yc-line:#E7E3F6;--yc-raise:#F6F4FF;--yc-btn:#ECE8FF;--yc-accent:var(--ultra);--yc-ultra:var(--ultra)}
html{background:#212121}
html[data-theme=light]{background:#fff}
.yc{position:relative;background:var(--yc-bg);color:var(--yc-fg);border-radius:24px;box-shadow:0 0 0 1px var(--yc-line),0 20px 50px -30px rgba(0,0,0,.6);padding:16px;font-family:var(--disp);transition:background .4s,color .4s,box-shadow .4s;max-width:560px}
.yc + .yc{margin-top:12px}
.yc-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.yc-h .tt{font-weight:800;font-stretch:75%;font-size:26px;line-height:1;letter-spacing:-.005em}
.yc-h .meta{margin-left:auto;font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--yc-mute);text-align:right}
.yc-sub{margin:-6px 0 14px;font-size:15px;color:var(--yc-mute)}
.amts{display:flex;gap:6px;margin-bottom:12px}
.amts button{flex:1;height:38px;border:0;border-radius:12px;background:var(--yc-raise);color:var(--yc-fg);font:700 15px var(--mono);cursor:pointer;box-shadow:inset 0 0 0 1px var(--yc-line);transition:background .25s,color .25s,transform .3s var(--spring)}
.amts button[aria-pressed=true]{background:var(--yc-fg);color:var(--yc-bg);transform:scale(1.04)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 10px 10px 10px;border-radius:18px;background:var(--yc-raise);box-shadow:inset 0 0 0 1px var(--yc-line);transition:opacity .3s,filter .3s}
.row.zero{opacity:.45;filter:saturate(.3)}
.row .cv{width:42px;height:42px}
.row .cv svg{width:100%;height:100%}
.row .nm{min-width:0}
.row .tk{font-weight:800;font-stretch:75%;font-size:21px;line-height:1;letter-spacing:.01em}
.row .sub{display:flex;gap:8px;margin-top:5px;font:600 13px var(--mono);color:var(--yc-mute);white-space:nowrap}
.row .sub .pc{color:var(--yc-fg)}
.stp{display:flex;align-items:center;gap:2px;background:var(--yc-bg);border-radius:14px;padding:3px;box-shadow:inset 0 0 0 1px var(--yc-line)}
.stp button{width:36px;height:36px;border:0;border-radius:11px;background:var(--yc-btn);color:var(--yc-fg);display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--spring),background .2s}
.stp button:active{transform:scale(.86)}
.stp button svg{width:14px;height:14px}
.stp .v{width:26px;text-align:center;font:800 16px var(--mono)}
.bsk-foot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 12px;font:600 13px var(--mono);color:var(--yc-mute)}
.bsk-foot b{color:var(--yc-fg);font-size:15px}
.route{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:6px;padding:14px 12px;border-radius:18px;background:var(--yc-raise);margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--yc-line)}
.node{display:grid;justify-items:center;gap:6px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--yc-mute);text-align:center}
.node i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.node i svg{width:100%;height:100%}
.node b{color:var(--yc-fg);font-size:12px}
/* The wire: Marlin's round dashes; while a trade runs they travel by transform, not by stroke offset. */
.wire{height:10px;overflow:hidden;position:relative}
.wire i{position:absolute;left:-24px;right:0;top:3.5px;height:3px;border-radius:2px;background:radial-gradient(circle at 1.5px 1.5px,var(--yc-accent) 1.5px,transparent 1.6px) 0 0/12px 3px repeat-x}
.route[data-state=run] .wire i{animation:wireRun .7s linear infinite}
.route[data-state=done] .wire i{left:0;background:var(--mint)}
.route[data-state=off] .wire i{opacity:.35}
@keyframes wireRun{to{transform:translateX(24px)}}
.kv{display:grid;gap:0;margin:0 0 14px}
.kv div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--yc-line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv dt{color:var(--yc-mute)}
.kv dd{margin:0;font:700 15px var(--mono);text-align:right}
.gets{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.est-note{font-size:12.5px;line-height:1.35;color:var(--yc-mute);margin:0 2px 12px}
.done-h{font-weight:800;font-stretch:75%;font-size:64px;line-height:.85;margin:4px 0 6px;letter-spacing:-.01em}
.done-h .shim{--s1:var(--yc-fg);--s2:var(--volt);--sd:1.6s}
.gpt[data-theme=light] .done-h .shim{--s2:var(--ultra)}
.done-coins{display:flex;margin:12px 0 14px}
.done-coins span{width:44px;height:44px;margin-right:-10px;border-radius:50%;box-shadow:0 0 0 3px var(--yc-bg);transform:scale(0)}
.done-coins.go span{animation:popin .5s var(--spring) forwards}
.done-coins span img,.done-coins span svg{width:100%;height:100%;border-radius:50%;display:block}
.done-xp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-radius:18px;background:var(--night);color:var(--cloud);margin-bottom:12px}
.xp-big{font:800 clamp(44px,12vw,58px)/1 var(--mono);color:var(--volt);letter-spacing:-.04em}
.xp-big small{font-size:.42em;letter-spacing:0;margin-left:.15em}
.done-xp .xp-big{font-size:44px}
.done-xp .st{display:flex;align-items:center;gap:6px;font:700 13px var(--mono);color:var(--ember)}
.done-xp .st svg{width:18px;height:18px}
.bag-tot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:-4px 0 14px}
.bag-tot .v{font:800 40px/1 var(--mono);letter-spacing:-.04em}
.chg{font:700 14px var(--mono);padding:4px 8px;border-radius:999px}
.chg.up{color:#06291C;background:var(--mint)}
.chg.dn{color:#fff;background:var(--rose)}
.gpt[data-theme=light] .chg.up{background:#C9FBE6;color:#04724A}
.prow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--yc-raise);box-shadow:inset 0 0 0 1px var(--yc-line);overflow:hidden}
.prow .tk{font-weight:800;font-stretch:75%;font-size:21px;line-height:1}
.prow .vline{margin-top:5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.prow .val{font:800 17px var(--mono)}
.prow .pct{font:700 12.5px var(--mono)}
.prow .pct.up{color:var(--mint)}.prow .pct.dn{color:var(--rose)}
.gpt[data-theme=light] .prow .pct.up{color:#05935F}
.prow .conf{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px dashed var(--yc-line);font-size:14px;color:var(--yc-mute)}
.prow .conf b{color:var(--yc-fg);font-family:var(--mono)}
.prow.usdc .cv{border-radius:50%}
.prow .acts{display:flex;gap:6px}
.wc{display:grid;grid-template-columns:1fr;gap:12px}
.wc-side{display:grid;gap:10px;align-content:center}
@media (min-width:560px){.wc{grid-template-columns:240px 1fr;align-items:center}}
.next{font:600 12.5px var(--mono);color:var(--yc-mute);text-align:center}
.tabs{display:flex;gap:4px;padding:3px;border-radius:14px;background:var(--yc-raise);margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--yc-line)}
.tabs button{flex:1;border:0;background:none;height:36px;border-radius:11px;font:700 13px var(--disp);color:var(--yc-mute);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--yc-fg);color:var(--yc-bg)}
.lb{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lb li{display:grid;grid-template-columns:28px 34px 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px}
.lb li:nth-child(odd){background:var(--yc-raise)}
.lb .rk{font:800 14px var(--mono);color:var(--yc-mute);text-align:center}
.lb li:nth-child(1) .rk{color:var(--ember)}
.lb .av{width:34px;height:34px}
.lb .av svg{width:100%;height:100%}
.lb .hn{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .xp{font:800 15px var(--mono)}
.lb li.me{background:var(--night)!important;color:var(--cloud);margin-top:8px;box-shadow:0 0 0 2px var(--volt)}
.lb li.me .rk{color:var(--volt)}
.lb li.me .xp{color:var(--volt)}
.lb .hn small{font:600 11.5px var(--mono);color:var(--yc-mute)}.lb li.me .hn small{color:inherit;opacity:.7}
.lb .xp.dn{color:var(--rose)}.lb[aria-busy=true]{opacity:.5}
.lb-empty{margin:4px 2px 12px;font-size:14.5px;color:var(--yc-mute)}
.leaderboard .tabs{margin-bottom:8px}.leaderboard .tabs+.tabs{margin-bottom:12px}.leaderboard .tabs button{padding:0 2px;min-width:0}.leaderboard .tabs button:disabled{cursor:default}
.lb .mv{font:700 11px var(--mono);color:var(--mint);margin-left:6px}
.fine{margin:12px 2px 0;font-size:12.5px;color:var(--yc-mute);display:flex;gap:6px;align-items:center}
.fine svg{width:14px;height:14px}
.ok-line{display:flex;align-items:center;gap:8px;margin-top:10px;font:700 14px var(--mono);color:var(--mint)}
.ok-line svg{width:16px;height:16px}

/* ---------- adapter: what the real cards carry beyond Marlin's components, in Marlin's own parts ---------- */
.ar.shown{opacity:1}
.outgoing{position:absolute;left:calc(2px + var(--host-left,0px));right:calc(2px + var(--host-right,0px));top:calc(2px + var(--host-top,0px));pointer-events:none;z-index:2}
h1{margin:0}
.cv{display:block;border-radius:50%;overflow:hidden;flex:none}
.node i .cv,.done-coins span .cv{width:100%;height:100%}
.prow .pct:not(.up):not(.dn){color:var(--yc-mute)}
.btn.wait{opacity:.6;pointer-events:none}
.wc-side .sound{justify-self:center}
.kv.stale dd{opacity:.6}
.cv img{display:block;width:100%;height:100%;border-radius:50%}
.cv.nologo{display:grid;place-items:center;color:var(--night);font:800 18px var(--disp);font-stretch:75%}
.node i.cvi{overflow:hidden}
.node i.cvi img{width:100%;height:100%;border-radius:50%;display:block}
.lb .av.ltr{border-radius:50%;display:grid;place-items:center;color:var(--night);font:800 16px var(--disp);font-stretch:75%}
/* The amount you type: the fourth chip of the amount row. */
.amts label{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;height:38px;border-radius:12px;background:var(--yc-raise);color:var(--yc-fg);font:700 15px var(--mono);box-shadow:inset 0 0 0 1px var(--yc-line);transition:background .25s,color .25s,transform .3s var(--spring);cursor:text}
.amts label input{all:unset;width:3.2em;min-width:0;text-align:left;font:700 15px var(--mono);color:inherit;-moz-appearance:textfield}
.amts label input::-webkit-outer-spin-button,.amts label input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amts label{position:relative}
.amts label .hint{display:none;position:absolute;left:28px;top:0;bottom:0;align-items:center;pointer-events:none;color:var(--yc-mute)}
.amts label.empty:not(:focus-within) .hint{display:flex}
.amts label.on{background:var(--yc-fg);color:var(--yc-bg);transform:scale(1.04)}
.amts label:focus-within{box-shadow:inset 0 0 0 2px var(--yc-accent)}
.amts button:disabled,.amts label:has(input:disabled){opacity:.5;cursor:default}
.stp button:disabled{opacity:.35;cursor:default}
.row .est{font:600 13px var(--mono);color:var(--yc-mute);text-align:right;white-space:nowrap}
.row .est b{display:block;color:var(--yc-fg);font:800 15px var(--mono)}
.row .where,.row .reason{grid-column:2/-1;margin-top:-4px;font:600 12px var(--mono);color:var(--yc-mute)}
.row .links{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.tx{font:700 12px var(--mono);color:var(--yc-fg);text-decoration:underline;text-decoration-color:var(--yc-line);text-underline-offset:3px}
.stat{font:700 12px var(--mono);letter-spacing:.04em}
.stat.ok{color:var(--mint)}.stat.wait{color:var(--yc-accent)}.stat.bad{color:var(--rose)}
.gpt[data-theme=light] .stat.ok{color:#05935F}
.yc-alert{display:grid;gap:2px;margin:0 0 12px;padding:12px 14px;border-radius:18px;background:rgba(255,92,138,.1);box-shadow:inset 0 0 0 1px rgba(255,92,138,.4);font-size:14px}
.yc-alert strong{color:var(--yc-fg);font-weight:700}
.yc-alert span{color:var(--yc-mute)}
.acts-row{display:flex;gap:8px;margin-top:10px}
.acts-row .btn{flex:1}
.note{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--mono);padding:4px 10px 4px 4px;border-radius:999px;background:var(--yc-raise);box-shadow:inset 0 0 0 1px var(--yc-line);color:var(--yc-mute)}
.chip.plain{padding-left:10px}
.chip .cv{width:22px;height:22px}
.chip.up{color:var(--mint)}.chip.dn{color:var(--rose)}
.gpt[data-theme=light] .chip.up{color:#05935F}
.problem .yc-h .tt{color:var(--rose)}
.problem p.msg{font-size:15px;line-height:1.45;color:var(--yc-mute);margin:0 0 4px}
.waiting{display:flex;align-items:center;gap:12px;font:600 13px var(--mono);color:var(--yc-mute);padding:14px 16px}
.waiting::after{content:"";flex:1;height:3px;min-width:2rem;border-radius:2px;background:radial-gradient(circle at 1.5px 1.5px,var(--yc-accent) 1.5px,transparent 1.6px) 0 0/12px 3px repeat-x;opacity:.7}
.home-logo{display:block;line-height:0;color:var(--yc-fg)}
.home-logo svg{display:block;height:24px;width:auto}
.home-logo path{fill:currentColor}
.mention{color:var(--yc-ultra);font-weight:700}

/* ---------- XP and streak: the cards' own streak (flames and the dotted day ahead), on Marlin's surfaces ---------- */
.xpbox{display:flex;flex-direction:column;gap:10px;background:var(--yc-raise);box-shadow:inset 0 0 0 1px var(--yc-line);border-radius:18px;padding:12px;margin:0 0 12px}
.xpbox .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.xpnum{font:800 26px/1 var(--mono);letter-spacing:-.03em;color:var(--yc-accent)}
.stchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px 0 8px;border-radius:999px;background:rgba(255,138,61,.12);color:var(--ember);font:700 13px var(--mono);box-shadow:inset 0 0 0 1px rgba(255,138,61,.4)}
.stchip svg{width:18px;height:18px;transform-origin:50% 100%;animation:flame 1.7s ease-in-out infinite}
.days{display:flex;gap:6px}
.days .dd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font:600 11px/1 var(--mono);color:var(--yc-mute)}
.days .dd i{position:relative;width:100%;max-width:38px;aspect-ratio:1;border-radius:10px;background:var(--yc-bg);display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--yc-line);font-style:normal}
.days .dd.on i{background:var(--ember);box-shadow:none;color:var(--night)}
.days .dd.today i{background:transparent;box-shadow:none;border:2px dashed var(--yc-accent)}
.days .dd.today i::after{content:"";position:absolute;inset:-6px;border-radius:14px;border:2px solid var(--yc-accent);opacity:0;animation:today 2.4s ease-out infinite}
.days .dd.goal{color:var(--yc-accent);font-weight:700}
.days .dd i svg{width:16px;height:16px;transform-origin:50% 100%;animation:flame 1.7s ease-in-out infinite}
.days .dd.on:nth-child(2) i svg{animation-delay:-.4s}.days .dd.on:nth-child(3) i svg{animation-delay:-.9s}.days .dd.on:nth-child(4) i svg{animation-delay:-1.3s}
@keyframes flame{0%,100%{transform:scaleY(1) skewX(0)}25%{transform:scaleY(1.08) skewX(-3deg)}50%{transform:scaleY(.95) skewX(2deg)}75%{transform:scaleY(1.05) skewX(-1deg)}}
@keyframes today{0%{opacity:.6;transform:scale(.85)}70%,100%{opacity:0;transform:scale(1.1)}}
.streak{font:600 12.5px var(--mono);color:var(--yc-mute)}

/* ---------- daily spin: Marlin's wheel card around the cards' own wheel (src/wheel.js); one size, no zoom ---------- */
.yc.wheel-card{overflow:hidden;contain:paint}
/* wheel.js keeps room for its end zoom under the wheel; with the zoom off that strip (about a tenth) is taken back. */
.spin-wheel{position:relative;width:100%;max-width:290px;aspect-ratio:1;justify-self:center;margin:0 auto -28px}
.spin-wheel .wheel-stage{--wheel-zoom:1;--bulb:#FFF6C4}
.spin-wheel .wheel-stage.tense .wheel-wrap{transform:none}
.spin-wheel .wheel-rays{display:none}
.spin-wheel .wheel-rotor{box-shadow:0 18px 40px -12px rgba(0,0,0,.6),0 0 0 2px rgba(9,7,28,.6)}
.spin-wheel .wheel-hub{background:radial-gradient(circle at 50% 35%,var(--ultra-2) 0%,var(--ultra-3) 72%);font-family:var(--disp);font-stretch:75%;font-weight:800;letter-spacing:.02em;
 box-shadow:0 0 0 5px var(--volt),0 0 0 8px var(--night),0 0 0 10px var(--volt-2),0 8px 22px rgba(0,0,0,.5)}
.spin-wheel .wheel-stage.st-ready .wheel-hub:not(:disabled){animation:none}
.spin-wheel .wheel-stage.st-won .wheel-halo,.spin-wheel .wheel-stage.st-won .wheel-wedge{animation-iteration-count:3}
.spin-wheel .wheel-stage.st-won .wheel-hub{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--win) 75%,#fff) 0%,var(--win) 55%,color-mix(in srgb,var(--win) 55%,#000) 100%)}
.spin-won{font:800 44px/1 var(--mono);letter-spacing:-.04em;color:var(--yc-accent);text-align:center}

/* ---------- share: the picture, then save or share ---------- */
.share-panel{display:grid;gap:8px;margin-top:12px;padding:8px;border-radius:18px;background:var(--yc-raise);box-shadow:inset 0 0 0 1px var(--yc-line)}
.share-panel canvas{display:block;width:100%;height:auto;aspect-ratio:1200/630;border-radius:12px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
/* Signing: the inline email-code sign-in, the trade clock, each coin's state (motion on transform and opacity only). */

.btn.hold{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btn .hold-fill{position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.6);mix-blend-mode:overlay;transform-origin:0 50%;transform:scaleX(0);z-index:2;pointer-events:none;transition:transform .2s ease-out}
.btn.holding .hold-fill{transform:scaleX(1);transition:transform var(--hold,800ms) linear}
.btn.holding{animation:none}
.hold-hint{margin:8px 0 0;text-align:center;font:600 12.5px var(--mono);color:var(--yc-mute)}
.hold-hint.nudge{color:var(--yc-accent);animation:holdnudge .45s var(--spring,ease-out)}
.hold-hint.warn{color:var(--rose)}
/* The trade button when the trade finishes on the YEET page: a tap, with a small lock after the mark. */
.btn .ic.lock,.btn.cta.yeet .ic.lock,.btn.cta.skeet .ic.lock{width:.5em;height:.58em;margin-left:-.1em;opacity:.85;animation:none}
@keyframes holdnudge{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.signin-label{display:block;margin:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--yc-mute)}.ov-lead{margin:6px 0 10px;font-size:14.5px;line-height:1.4}

.yc.terms .msg{margin:0}.yc.terms .tx{display:inline-block;margin-top:8px}

.fine.refresh{flex-wrap:wrap}.fine.refresh .tx{color:var(--yc-accent);font-weight:700}
.signin{display:grid;gap:8px;margin:0 0 12px;padding:14px;border-radius:18px;background:var(--yc-raise);box-shadow:inset 0 0 0 1px var(--yc-line)}
.signin strong{font:700 15px var(--disp);color:var(--yc-fg)}.signin .next{text-align:left}.signin .reason{color:var(--rose);font:600 12.5px var(--mono)}
.signin-row{display:flex;gap:8px}.signin-row input{flex:1;min-width:0;height:40px;padding:0 12px;border:0;border-radius:12px;background:var(--yc-bg);color:var(--yc-fg);font:600 15px var(--mono);box-shadow:inset 0 0 0 1px var(--yc-line)}
.signin-row input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--yc-accent)}.signin .acts-row{justify-content:flex-start;margin:0}.signin .acts-row .btn{flex:0 0 auto}
.settle{height:4px;margin:2px 0 14px;border-radius:4px;background:var(--yc-line);overflow:hidden}
.settle i{display:block;height:100%;background:var(--yc-accent);transform-origin:0 50%;transform:scaleX(.04);transition:transform 1s linear}
.settle-say{margin:10px 0 0}.pagebox{background:var(--yc-raise);box-shadow:inset 0 0 0 1px var(--yc-line)}.pagebox .tx{justify-self:start;margin-top:6px}.pagebox .acts-row{margin-top:8px;justify-content:flex-start}.pagebox .acts-row .btn{flex:0 0 auto}
.legs .row[data-state=sign] .stat,.legs .row[data-state=send] .stat,.legs .row[data-state=swap] .stat{animation:breathe 1.6s ease-in-out infinite}
.legs .stat{display:inline-block}.legs .stat.flip{animation:popin .45s var(--spring) both}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.legs .row .stat,.legs .row .cv{animation:none}.settle i{transition:none}}
.receipt .yc-h .meta{white-space:nowrap}

const HOLD_MS=800,HOLD_MOVE=12,ARM_MS=6000;

 const hint=el('p','hold-hint',`Press and hold to ${what}`);hint.dataset.role='hold-hint';b.hint=hint;

 let timer=null,at=null,armed=0,fired=0;
 const stop=()=>{window.clearTimeout(timer);timer=null;at=null;b.classList.remove('holding')};
 const fire=()=>{stop();fired=now();armed=0;run()};
 const start=p=>{if(b.disabled||timer!==null)return;at=p;hint.classList.remove('nudge');b.classList.add('holding');timer=window.setTimeout(fire,HOLD_MS)};
 b.addEventListener('pointerdown',e=>{if(e.button>0)return;start({x:e.clientX||0,y:e.clientY||0})});
 b.addEventListener('pointermove',e=>{if(at&&Math.hypot((e.clientX||0)-at.x,(e.clientY||0)-at.y)>HOLD_MOVE)stop()});
 for(const ev of ['pointerup','pointercancel','pointerleave','blur'])b.addEventListener(ev,stop);

 b.addEventListener('keyup',e=>{if(e.key!==' '&&e.key!=='Enter')return;e.preventDefault();stop()});
 b.onclick=e=>{
  e.preventDefault();if(b.disabled||now()-fired<1000)return;
  if(e.detail>0){hint.classList.remove('nudge');void hint.offsetWidth;hint.classList.add('nudge');return}
  if(now()-armed<ARM_MS){fire();return}
  armed=now();hint.textContent=`Activate again to ${what}`;b.setAttribute('aria-label',`Activate again to ${what}`);hint.setAttribute('role','status');
  window.setTimeout(()=>{if(now()-armed>=ARM_MS){hint.textContent=label;b.setAttribute('aria-label',label)}},ARM_MS);
 };

}

const FUNDS_AT={not_sent:['still in your wallet','still in your wallet'],sent:['on the way to the 1Click deposit address','on the way to the 1Click deposit address'],PENDING_DEPOSIT:['on the way to the 1Click deposit address','on the way to the 1Click deposit address'],KNOWN_DEPOSIT_TX:['at the 1Click deposit address','at the 1Click deposit address'],INCOMPLETE_DEPOSIT:['at the 1Click deposit address, short of the quote','at the 1Click deposit address, short of the quote'],PROCESSING:['being swapped','being swapped'],SUCCESS:['in your wallet','in your wallet'],REFUNDED:['refunded to your wallet','refunded to your wallet']};

 *  runs the trade, the send_status submit_trade_signature answered for leg i. state: sign, send, sent, swap, done, refunded, failed. */
function legState(t,l,i){

 switch(l.status){
  case 'SUCCESS':return ['Landed','ok','done'];
  case 'REFUNDED':return ['Refunded','bad','refunded'];
  case 'FAILED':return [l.origin_tx?'Didn’t go through':'Not sent','bad','failed'];
  case 'PROCESSING':case 'KNOWN_DEPOSIT_TX':return ['Swapping','wait','swap'];
  case 'INCOMPLETE_DEPOSIT':return ['Deposit short','wait','swap'];
 }
 if(s==='expired'||s==='not_sent'||s==='failed')return ['Not sent','bad','failed'];

  if(!final&&!stopped&&legs.length){

   const say=el('p','next settle-say');say.setAttribute('role','status');
   settleUi={meta:m,bar:fill,say,n:landed,total:legs.length,since:sinceOf(t),page};
   c.append(bar);paintSettle(settleUi);
   if(page&&mine.page){const again=mine.back>0;const box=mark(el('div','yc-alert pagebox'),again?'page-back':'page');box.setAttribute('role','status');
    box.append(el('strong',null,again?'Not finished yet':'The YEET page is open'),el('span',null,again?'Nothing has moved. Open the YEET page again to finish, or cancel.':'Press and hold there to send this trade. This card continues by itself.'));
    const url=mine.page,acts=el('div','acts-row page-acts');
    const a=button('ink sm','Open the YEET page',()=>reopenPage(url));a.dataset.role='sign-page';
    const x=button('ghost xs','Cancel',()=>activeRun?.cancelPage());x.dataset.role='page-cancel';
    acts.append(a,x);box.append(acts);c.append(box)}
  }
  if(syms.length)c.append(route(t.direction,syms,stopped?'off':ROUTE_STATE[t.status]??'run',stopped?'Stopped':page?'Waiting':ROUTE_SAY[t.status]??'On its way'));
  if(legs.length)c.append(legRows(t));
  if(settleUi)c.append(settleUi.say);
  if(got.length){const kv=mark(el('dl','kv'),'got');kv.style.marginTop='12px';const g=el('dd','gets');for(const r of got)g.append(el('span','num',`${amount(r.amount)} ${r.symbol}`));const d=el('div');d.append(el('dt',null,'You got'),g);kv.append(d);c.append(kv)}
  if(xp)c.append(xpLine(t));
 }
 c.dataset.status=t.status??'';
 const scene=final?shareScene():null;
 if(scene){const acts=mark(el('div','acts-row'),'actions');acts.append(shareButton());c.append(acts);if(shareOpen)c.append(sharePanel(scene))}
 if(mine?.reason==='wallet'){const acts=el('div','acts-row');acts.append(button('ghost sm','Sign out of this wallet',()=>{loadSigner().then(s=>s?.logout()).catch(()=>{});note='Signed out. Ask in the chat for a new quote.';trading=null;render()}));c.append(acts)}
 if(note)c.append(noteLine(note));
 else if(!final&&!canCall())c.append(noteLine('Ask in the chat for your trade status.'));
 const when=clock(t.updated_at);if(when&&t.status!=='success')c.append(el('p','fine',`Updated ${when}`));
 return c;
}
/** The daily check-in card: the wheel card alone (XP, streak, stamps, the spin). */
function renderCheckin(d){
 const xp=d.checkin;
 if(spinsLeft(xp)===0&&!spinWon&&!spinBusy)recallSpin();
 return wheelSection(xp);
}
function renderSpin(){return wheelSection(null)}
function renderLucky(){return wheelSection(null)}
function renderPortfolio(d){
 const when=clock(d.priced_at);const c=card('portfolio','Your bag',when?`Prices ${when}`:'Live');
 const tot=el('div','bag-tot');tot.append(mark(el('span','v num',money(d.total_usd)??'—'),'total',true));c.append(tot);
 const list=el('div','rows');
 const base=mark(el('div','prow usdc'),'row:usdc');base.append(cv('USDC'));{const nm=el('div','nm');nm.append(el('div','tk','USDC'));const v=el('div','vline');v.append(mark(el('span','val num',money(d.base?.usdc)??'—'),'val:usdc',true));nm.append(v);base.append(nm,el('span'))}
 list.append(base);
 const rows=(Array.isArray(d.solana?.holdings)?d.solana.holdings:[]).filter(h=>safeSymbol(h?.symbol)).slice(0,25);
 rows.sort((a,b)=>(Number(b.usd)||0)-(Number(a.usd)||0));
 for(const h of rows){
  const r=mark(el('div','prow'),`row:${h.symbol}`);r.append(cv(h.symbol));
  const nm=el('div','nm');nm.append(el('div','tk',h.symbol));const v=el('div','vline');v.append(mark(el('span','val num',money(h.usd)??'—'),`val:${h.symbol}`,true),el('span','pct',amount(h.amount)??'—'));nm.append(v);r.append(nm);
  const acts=el('div','acts');
  if(canCall()){
   const more=button('yeet xs','YEET more',null,'i-bolt');more.onclick=()=>yeetMore(h.symbol,more);more.setAttribute('aria-label',`YEET more ${h.symbol}`);
   const sell=button('skeet xs','SKEET',null,'i-target');sell.onclick=()=>skeet(h.symbol,sell);sell.setAttribute('aria-label',`SKEET ${h.symbol}`);
   acts.append(more,sell);
  }
  r.append(acts);list.append(r);
 }
 c.append(list);
 if(!rows.length)c.append(noteLine('No coins yet. Type @yeet me a win in the chat.'));
 const scene=shareScene();
 if(scene){const acts=mark(el('div','acts-row'),'actions');acts.append(shareButton());c.append(acts);if(shareOpen)c.append(sharePanel(scene))}
 if(note)c.append(noteLine(note));
 return c;
}
const REFRESHABLE=new Set(['REQUOTE_REQUIRED','CONFIRMATION_REQUIRED','COST_TOO_HIGH','TEMPORARILY_UNAVAILABLE']);
function renderError(d,proposal_id){
 const code=typeof d?.error==='string'&&Object.hasOwn(ERRORS,d.error)?d.error:'TEMPORARILY_UNAVAILABLE';const [title,body,retryable]=ERRORS[code];
 const c=card('problem',title,null);c.dataset.code=code;c.setAttribute('role','alert');
 c.append(el('p','msg',OWN_MESSAGE.has(code)&&typeof d?.message==='string'&&d.message?d.message.slice(0,500):body));
 const fund=code==='BALANCE_LOW'?fundUrl(d.fund_url):null;
 if(fund)c.append(fundButton(fund));
 const pid=proposal_id||state.proposal_id;
 if(retryable&&REFRESHABLE.has(code)&&pid&&canCall()){const box=el('div','acts-row');box.append(button('ghost sm','Refresh quote',()=>refresh(pid)));c.append(box)}
 if(note)c.append(noteLine(note));
 return c;
}
function copyOf(node,cls){
 const g=node.cloneNode(true);g.classList.remove('in');g.classList.add(cls);g.setAttribute('aria-hidden','true');g.inert=true;
 for(const n of [g,...g.querySelectorAll('[data-role],[data-k],[id]')]){n.removeAttribute('data-role');n.removeAttribute('data-k');n.removeAttribute('id')}
 return g;
}
function fadeOut(node,frames,after){
 let a=null;try{a=node.animate(frames,{duration:340,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'})}catch{/* no animation here */}
 const done=()=>{node.remove();after?.()};
 if(a&&typeof a.finished?.then==='function')a.finished.then(done,done);else done();
}
function entrance(node){
 node.querySelectorAll('.stag').forEach((li,i)=>{try{li.animate([{opacity:0,transform:'translate(-60px,16px)'},{opacity:1,transform:'translate(0,16px)',offset:.55},{opacity:1,transform:'none'}],{duration:800,delay:300+i*70,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'})}catch{/* no animation here */}});
 node.querySelectorAll('[data-count-to]').forEach((n,i)=>{const to=Number(n.dataset.countTo);const pre=n.textContent.startsWith('+')?'+':'';window.setTimeout(()=>windup(n,to,{pre,dur:900}),500+i*70)});
}
let lockTimer=null;
const WHEEL_KINDS=new Set(['spin','lucky','checkin']);
function render(){
 let node;const kind=!current||current.kind==='waiting'?'waiting':current.kind;
 if(kind==='waiting')node=el('div','yc waiting',WAITING[VIEW]??'Loading…');
 else try{
  node=current.kind==='overview'?renderOverview(current.data):current.kind==='fund'?renderFund(current.data):current.kind==='referral'?renderReferral(current.data):current.kind==='basket'?renderBasket(current.data):current.kind==='receipt'?renderReceipt(current.data):current.kind==='home'?renderHome(current.data)
   :current.kind==='portfolio'?renderPortfolio(current.data):current.kind==='leaderboard'?renderLeaderboard(current.data):current.kind==='spin'?renderSpin(current.data)
   :current.kind==='lucky'?renderLucky(current.data):current.kind==='checkin'?renderCheckin(current.data):renderError(current.data,current.proposal_id);
 }catch{node=renderError({error:'TEMPORARILY_UNAVAILABLE'})}
 if(termsDue&&kind!=='waiting')node=renderTerms();
 if(kind!=='basket')basketUi=null;
 if(kind!=='receipt')settleUi=null;
 if(stale&&kind!=='waiting'){const host=node.matches('.yc')?node:[...node.children].filter(n=>n.matches('.yc')).at(-1);if(host&&!host.querySelector('[data-role=refresh-app]'))host.append(refreshLine())}
 const old=[...root.children].find(c=>!c.classList.contains('outgoing'))??null;
 const ghosts=[...root.children].filter(c=>c.classList.contains('outgoing'));
 const moving=!REDUCED&&!!old&&old.getBoundingClientRect().height>0;
 const keys=new Map([...node.querySelectorAll('[data-k]')].map(n=>[n.dataset.k,n.textContent]));
 const cards=node.matches('.yc')?[node]:[...node.children].filter(n=>n.matches('.yc'));
 const entering=kind!==lastKind&&!(WHEEL_KINDS.has(kind)&&WHEEL_KINDS.has(lastKind));
 if(entering){
  cards.forEach((c,i)=>{c.classList.add('ar','in');c.style.setProperty('--d',`${i*85}ms`)});
  if(moving){const g=copyOf(old,'outgoing');ghosts.push(g);fadeOut(g,[{opacity:1,transform:'none'},{opacity:0,transform:'translate3d(56px,-16px,0)'}])}
 }else{
  cards.forEach(c=>c.classList.add('ar','shown'));
  for(const n of node.querySelectorAll('.legs .stat[data-k]'))if(prevKeys.has(n.dataset.k)&&prevKeys.get(n.dataset.k)!==n.textContent)n.classList.add('flip');
  for(const n of node.querySelectorAll('.num[data-k]')){const k=n.dataset.k;if(prevKeys.has(k)&&prevKeys.get(k)!==n.textContent){const a=numIn(prevKeys.get(k)),b=numIn(n.textContent);pulse(n,Number.isFinite(a)&&Number.isFinite(b)?Math.sign(b-a):0)}}
 }
 lastKind=kind;prevKeys=keys;
 if(node.parentNode===root){for(const ch of [...root.children])if(ch!==node&&!ghosts.includes(ch))ch.remove();for(const g of ghosts)if(g.parentNode!==root)root.append(g)}
 else root.replaceChildren(node,...ghosts);
 reportHeight();
 if(entering)entrance(node);
 window.clearInterval(lockTimer);lockTimer=null;
 if(settleUi)lockTimer=window.setInterval(()=>{if(!settleUi?.meta.isConnected){window.clearInterval(lockTimer);return}paintSettle(settleUi)},1000);
 if(shareOpen&&moving){const p=node.querySelector('.share-panel');p?.scrollIntoView?.({block:'nearest',behavior:'smooth'})}
}


window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;const msg=event.data;if(!msg||msg.jsonrpc!=='2.0')return;
 if(!has(msg,'method')&&(has(msg,'result')||has(msg,'error'))&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);window.clearTimeout(p.timer);msg.error?p.reject(msg.error):p.resolve(msg.result);return}
 if(msg.method==='ping'&&has(msg,'id'))window.parent.postMessage({jsonrpc:'2.0',id:msg.id,result:{}},'*');
 if(msg.method==='ui/notifications/tool-result'){const p=msg.params||{};receive(p.structuredContent,p._meta,p.isError===true,p)}
 if(msg.method==='ui/notifications/host-context-changed'&&msg.params?.safeAreaInsets)applyInsets(msg.params.safeAreaInsets);
 if(msg.method==='ui/notifications/host-context-changed'&&has(msg.params,'theme'))applyTheme(msg.params.theme);
 if(msg.method==='ui/notifications/tool-cancelled'&&!current){lastKind='cancelled';root.replaceChildren(el('p','note','Cancelled.'));reportHeight()}
});
window.addEventListener('openai:set_globals',event=>{
 const g=event.detail?.globals;if(!g)return;if(g.safeArea)applyInsets(g.safeArea.insets);if(has(g,'theme'))applyTheme(g.theme);
 if(has(g,'toolOutput'))receive(g.toolOutput,g.toolResponseMetadata??window.openai?.toolResponseMetadata,false);
});
if(typeof window.ResizeObserver==='function')new window.ResizeObserver(reportHeight).observe(root);
applyTheme(window.openai?.theme);
if(window.openai){if(window.openai.safeArea)applyInsets(window.openai.safeArea.insets);if(window.openai.toolOutput!==undefined&&window.openai.toolOutput!==null)receive(window.openai.toolOutput,window.openai.toolResponseMetadata,false)}
if(!current&&state.trade_id&&VIEW==='receipt'&&canCall()){current={kind:'receipt',data:{trade_id:state.trade_id,status:'submitted',legs:[]}};poll(0)}
render();
if(window.parent!==window)request('ui/initialize',{appInfo:{name:'YEET',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'}).then(r=>{
 host.ready=true;const caps=r?.hostCapabilities;host.canOpen=!!caps?.openLinks;host.canCallTools=!!caps?.serverTools;
 if(r?.hostContext?.safeAreaInsets)applyInsets(r.hostContext.safeAreaInsets);
 if(has(r?.hostContext,'theme'))applyTheme(r.hostContext.theme);
 notify('ui/notifications/initialized');lastHeight=-1;
 if(current?.kind==='receipt'&&!FINAL.has(current.data.status))poll(POLL_MS);
 render();
}).catch(()=>{/* window.openai, when present, still serves the card. */});
})(window);
</script></body></html>
