<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YEET leaderboard</title>
<style>/* YEET design tokens. Dark first. The copy the site serves is apps/landing/tokens.css; edit here, then copy. */
:root {
  color-scheme: dark;

  /* ground */
  --ink-950: #06071C;
  --ink-900: #0A0C2B;
  --ink: #0F1240;
  --ink-700: #181D5E;
  --ink-600: #232A7A;
  --blue: #2430FF;
  --blue-deep: #1820C4;
  --blue-lift: #4A55FF;

  /* brand: the logo, XP, highlights */
  --yellow: #FFE03A;
  --yellow-lift: #FFEE78;
  --yellow-deep: #F2C200;

  /* the two actions */
  --yeet: #22E27A;
  --yeet-lift: #8AF7B6;
  --yeet-deep: #0FB95C;
  --skeet: #FF4D8D;
  --skeet-lift: #FF88B4;
  --skeet-deep: #EE2E77;

  /* text and lines on dark */
  --text: #F4F5FF;
  --muted: #A9AEDD;
  --dim: #6E74B2;
  --line: rgba(255, 255, 255, .12);
  --line-strong: rgba(255, 255, 255, .22);
  --surface: rgba(15, 18, 64, .72);
  --surface-solid: #12164C;

  /* light surfaces (cards inside ChatGPT, print) */
  --paper: #FFFFFF;
  --sky: #EEF0FF;
  --line-light: #DADDF5;
  --muted-light: #5A5E8A;

  /* price moves */
  --up: #22E27A;
  --down: #FF6B8F;

  /* coin chips */
  --coin-1: #FFB238;
  --coin-2: #F27BB3;
  --coin-3: #9C84FF;
  --coin-4: #38D1C0;
  --coin-5: #E3A86B;

  /* type */
  --font-display: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --text-hero: clamp(3.5rem, 17.5vw, 9.5rem);
  --text-h2: clamp(2rem, 8.6vw, 4rem);
  --text-h3: 1.25rem;
  --text-body: 1.0625rem;
  --text-small: .875rem;
  --leading-display: .9;
  --leading-body: 1.5;

  /* shape */
  --r-chip: 999px;
  --r-btn: 18px;
  --r-card: 22px;
  --r-tile: 28px;

  /* depth: soft, never a hard offset */
  --shadow-card: 0 20px 44px -24px rgba(2, 3, 20, .8);
  --shadow-pop: 0 28px 60px -20px rgba(2, 3, 20, .85);
  --glow-yeet: rgba(34, 226, 122, .55);
  --glow-skeet: rgba(255, 77, 141, .55);
  --glow-yellow: rgba(255, 224, 58, .45);

  /* motion */
  --dur-press: 120ms;
  --dur-out: 420ms;
  --dur-in: 760ms;
  --dur-glint: 850ms;
  --dur-edge: 9s;
  --dur-breathe: 4.8s;
  --dur-stretch: 5.2s;
  --dur-drift: 22s;
  --stagger: 70ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in: cubic-bezier(.6, 0, .9, .4);
  --ease-settle: cubic-bezier(.3, 1.25, .5, 1);
  --ease-glint: cubic-bezier(.45, 0, .2, 1);
}
/* The XP wheel (src/wheel.js). The stage fills a sized box; the wheel sizes itself into it, leaving room for the end zoom. */
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wheel-stage{--win:#f6cf5a;--bulb:#fff1c4;--slice-deg:30deg;position:absolute;inset:0;overflow:visible;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wheel-ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wheel-rays{position:absolute;left:var(--wheel-x,50%);top:var(--wheel-y,50%);width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;opacity:.32;
 background:repeating-conic-gradient(from 0deg,rgba(255,214,120,.16) 0deg 6deg,rgba(255,214,120,0) 6deg 18deg);
 -webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);
 animation:wheel-rays 60s linear infinite;transition:opacity 1.2s}
@keyframes wheel-rays{to{transform:rotate(360deg)}}
.wheel-stage.st-spin .wheel-rays,.wheel-stage.st-free .wheel-rays{opacity:.18}
.wheel-stage.tense .wheel-rays{opacity:.05}
.wheel-stage.st-won .wheel-rays{opacity:.55;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--win) 35%,transparent) 0deg 6deg,transparent 6deg 18deg);animation-duration:22s}
/* The darkening at the end: everything but the wheel. */
.wheel-vignette{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.6s;
 background:radial-gradient(circle at var(--wheel-x,50%) var(--wheel-y,50%),transparent calc(var(--wheel-size,600px)*.5),rgba(0,0,0,.72) calc(var(--wheel-size,600px)*1.05))}
.wheel-stage.tense .wheel-vignette{opacity:1}
.wheel-wrap{position:absolute;z-index:5;transform-origin:50% 7%;transition:transform 1.6s cubic-bezier(.45,0,.2,1);touch-action:none}
.wheel-stage.tense .wheel-wrap{transform:scale(var(--wheel-zoom,1.12))}
.wheel-stage.st-won .wheel-wrap{transition:transform .9s cubic-bezier(.2,.9,.25,1)}
.wheel-wrap.grabbing{cursor:grabbing}
.wheel-halo{position:absolute;inset:-4%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(246,207,90,.28) 52%,rgba(246,207,90,0) 70%);transition:opacity .8s}
.wheel-stage.st-won .wheel-halo{background:radial-gradient(circle,color-mix(in srgb,var(--win) 55%,transparent) 50%,transparent 70%);animation:wheel-halo 1.4s ease-in-out infinite}
@keyframes wheel-halo{50%{opacity:.55}}
.wheel-rotor{position:absolute;border-radius:50%;will-change:transform;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 2px rgba(0,0,0,.35)}
.wheel-rotor canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.wheel-blur{opacity:0}
.wheel-spot{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .5s;
 background:conic-gradient(from calc(var(--slice-deg)/-2),rgba(4,2,10,0) 0deg var(--slice-deg),rgba(4,2,10,.66) var(--slice-deg) 360deg)}
.wheel-stage.st-won .wheel-spot{opacity:1;transition-delay:.15s}
.wheel-wedge{position:absolute;pointer-events:none;opacity:0;overflow:visible}
.wheel-wedge path{fill:none;stroke:#fff;stroke-width:.018;stroke-linejoin:round;filter:drop-shadow(0 0 .02px #fff)}
.wheel-stage.st-won .wheel-wedge{opacity:1;animation:wheel-wedge 1.1s ease-in-out infinite;transition:opacity .4s .15s}
@keyframes wheel-wedge{50%{opacity:.55}}
.wheel-bulb{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 35%,#fff 0%,#6b5a3a 55%,#2a2114 100%);opacity:.55;transition:opacity .05s}
.wheel-bulb.on{opacity:1;background:radial-gradient(circle at 35% 35%,#fff 0%,var(--bulb) 40%,color-mix(in srgb,var(--bulb) 60%,#000) 100%);box-shadow:0 0 10px 2px color-mix(in srgb,var(--bulb) 80%,transparent),0 0 26px 6px color-mix(in srgb,var(--bulb) 35%,transparent)}
.wheel-stage.st-won{--bulb:var(--win)}
.wheel-flapper{position:absolute;pointer-events:none;transform-origin:50% 20%;will-change:transform;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.wheel-flapper svg{display:block;width:100%;height:100%;overflow:visible}
.wheel-hub{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;border:0;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 50% 35%,#3a2160 0%,#1a0c30 70%);color:#fff;font:inherit;font-weight:800;letter-spacing:.08em;line-height:1;
 box-shadow:0 0 0 6px #c99a2e,0 0 0 9px #7a520f,0 0 0 11px #f7d774,0 10px 30px rgba(0,0,0,.6),inset 0 6px 18px rgba(255,255,255,.18)}
.wheel-hub:disabled{cursor:default;opacity:1}
.wheel-hub-main{font-size:var(--hubfs,30px)}
.wheel-hub-sub{font-size:calc(var(--hubfs,30px)*.42);letter-spacing:.12em;opacity:.8;margin-top:4px}
.wheel-hub-sub:empty{display:none}
.wheel-stage.st-ready .wheel-hub:not(:disabled){animation:wheel-hubpulse 1.8s ease-in-out infinite}
@keyframes wheel-hubpulse{50%{box-shadow:0 0 0 6px #c99a2e,0 0 0 9px #7a520f,0 0 0 11px #f7d774,0 0 40px 10px rgba(246,207,90,.55),inset 0 6px 18px rgba(255,255,255,.18)}}
.wheel-stage.st-won .wheel-hub{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--win) 75%,#fff) 0%,var(--win) 55%,color-mix(in srgb,var(--win) 55%,#000) 100%);color:var(--winink,#fff)}
.wheel-fx{position:fixed;inset:0;z-index:15;width:100%;height:100%;pointer-events:none}
.wheel-flash{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--wheel-x,50%) var(--wheel-y,30%),rgba(255,255,255,.9),rgba(255,255,255,0) 60%)}
.wheel-flash.go{animation:wheel-flash .7s ease-out}
@keyframes wheel-flash{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wheel-rays{animation:none!important}}
/* YEET cards. Colours, type and motion come from brand/tokens.css (index.mjs puts it in front of this file).
   The parts are the brand's own, lifted from apps/landing/ui.css: living buttons, coin chips, the edge light,
   streak days, leaderboard rows, the trade wire, the share picture. System fonts only, nothing loaded from the network.
   Sizes are rem so a larger text size scales the card. Built for 320-480 px wide frames. */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--ink-950)}
body{margin:0;color:var(--text);background:linear-gradient(100deg,var(--ink-950) 30%,#0B0E3A 68%,#141A8A 135%);
 font:400 .9375rem/1.4 var(--font-body);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
main{position:relative;padding:calc(.75rem + var(--host-top,0px)) calc(.75rem + var(--host-right,0px)) calc(.75rem + var(--host-bottom,0px)) calc(.75rem + var(--host-left,0px))}
p{margin:0}
h1,h2{margin:0}
ul,ol{list-style:none;margin:0;padding:0}
button,input{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}
::selection{background:var(--yellow);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- the card: a soft panel on the ground, a line of light on its top edge, a few stars ---------- */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:.875rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.card>*{position:relative}
.card>.edge-line{position:absolute;inset:-1px -1px auto -1px;height:var(--r-card);border-radius:var(--r-card) var(--r-card) 0 0;overflow:hidden;pointer-events:none}
.edge-line::before{content:"";position:absolute;left:0;top:0;height:1.5px;width:40%;background:linear-gradient(90deg,transparent,var(--el,rgba(255,224,58,.85)),transparent);animation:edge var(--dur-edge) linear infinite;animation-delay:calc(var(--clk,0)*-1s)}
@keyframes edge{0%{transform:translateX(-100%)}55%,100%{transform:translateX(260%)}}
.card>.stars{position:absolute;inset:0 0 auto 0;height:3.25rem;pointer-events:none;overflow:hidden;border-radius:var(--r-card) var(--r-card) 0 0}
.tw{position:absolute;left:var(--x);top:var(--y);width:var(--s,10px);height:var(--s,10px);opacity:0;animation:twinkle var(--t,4s) ease-in-out infinite;animation-delay:calc(var(--clk,0)*-1s + var(--dl,0s))}
.tw::before{content:"";position:absolute;inset:0;background:var(--c,#fff);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
@keyframes twinkle{0%,64%,100%{opacity:0;transform:scale(.2) rotate(0)}76%{opacity:.9;transform:scale(1) rotate(45deg)}88%{opacity:.35;transform:scale(.55) rotate(80deg)}}

/* ---------- enter and leave: parts slide in from the left with a lean, one after the other ---------- */
.card.enter>*:not(.edge-line):not(.stars){animation:rise var(--dur-in) var(--ease-out) both;animation-delay:calc(var(--i,0)*var(--stagger))}
.card.enter .rows>li,.card.enter .lb>*{animation:rise var(--dur-in) var(--ease-out) both;animation-delay:calc((var(--i,0) + var(--j,0))*var(--stagger))}
@keyframes rise{from{opacity:0;transform:translateX(-14px) skewX(-5deg);filter:blur(3px)}}
.in{animation:pop .42s var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.tick{animation:tick .36s var(--ease-out) both}
@keyframes tick{from{opacity:.25;transform:translateY(3px)}}
.ghost{position:absolute;left:calc(.75rem + var(--host-left,0px));right:calc(.75rem + var(--host-right,0px));top:calc(.75rem + var(--host-top,0px));pointer-events:none;z-index:2}
.going{pointer-events:none;overflow:hidden}

/* ---------- head: the mark, a display heading, a short line on the right ---------- */
.head{display:flex;align-items:center;justify-content:space-between;gap:.5rem .625rem;flex-wrap:wrap;min-height:1.75rem}
.head .title{display:flex;align-items:center;gap:.5rem;min-width:0}
.head .mark{width:1.375rem;height:1.375rem;flex:none;color:var(--yellow)}
.head .mark path{fill:currentColor}
.head .sub{color:var(--muted);font:600 .8125rem/1.2 var(--font-mono);white-space:nowrap}
.display{font:italic 900 1.3125rem/1 var(--font-display);letter-spacing:-.035em;color:#fff}
.display .set{display:flex;flex-wrap:wrap;gap:.1em .26em}
.yw{display:block;line-height:0}
.yw svg{display:block;height:1em;overflow:visible}
.yw path{fill:currentColor}
.yw.em{color:var(--yellow)}
.logo{display:block;line-height:0}
.logo svg{display:block;height:1.5rem;width:auto}
.logo path{fill:#fff}
.waiting{color:var(--muted);padding:.75rem .25rem;display:flex;align-items:center;gap:.75rem}
.waiting::after{content:"";flex:1;height:2px;min-width:2rem;background:repeating-linear-gradient(90deg,var(--yellow) 0 6px,transparent 6px 11px);background-size:22px 2px;animation:wire .9s linear infinite;opacity:.7}
.note{color:var(--muted);font-size:.8125rem}
.fine{color:var(--muted);font-size:.75rem;opacity:.85}
.big{font:italic 900 2rem/1 var(--font-display);color:var(--yellow)}
.mention{display:inline-block;padding:0 .375rem;border-radius:.375rem;background:rgba(255,224,58,.18);color:var(--yellow);font-weight:650}

/* ---------- rows: coin chip, symbol over name, estimate, then the control ---------- */
.rows{display:flex;flex-direction:column;gap:.375rem}
.row{display:grid;grid-template-columns:2.5rem minmax(0,1fr) auto auto;align-items:center;gap:.375rem .5rem;background:rgba(6,7,28,.55);border:1px solid var(--line);border-radius:.875rem;padding:.5rem;min-height:3.5rem}
.row .reason,.row .where{grid-column:2/-1;color:var(--muted);font-size:.75rem}
.coin{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;flex:none;font:italic 900 .71875rem/1 var(--font-display);letter-spacing:-.03em;color:var(--ink);border:2px solid var(--ink);background:var(--coin-1)}
.coin.c2{background:var(--coin-2)}.coin.c3{background:var(--coin-3)}.coin.c4{background:var(--coin-4)}.coin.c5{background:var(--coin-5)}
.coin.usd{background:#2775CA;color:#fff;font-size:1rem;font-style:normal}
.coin.mini{width:1.5rem;height:1.5rem;font-size:.5rem;border-width:1.5px}
.who{display:flex;flex-direction:column;min-width:0}
.sym{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.share{color:var(--yellow);font-size:.75rem;font-weight:700;white-space:nowrap}
/* A coin at 0 parts: dimmed and out of the trade; its stepper stays usable so it can come back. */
.row.off>.coin,.row.off>.who,.row.off>.est{opacity:.45}
.row.off .share{color:var(--muted);font-weight:400}
.est{display:flex;flex-direction:column;align-items:flex-end;text-align:right;white-space:nowrap;font-size:.8125rem}
.est .amt{font-weight:700}
.est .usd,.est.muted{color:var(--muted);font-size:.75rem}
.row>.est:last-child{grid-column:3/-1}
/* Holdings: the two actions sit under the coin, side by side, YEET on the left. */
.row>.pair{grid-column:1/-1}

.stepper{display:flex;align-items:center;gap:.125rem;background:var(--ink-950);border:1px solid var(--line);border-radius:999px;padding:.125rem}
.btn.step{width:2rem;height:2rem;min-height:0;border-radius:50%;background:rgba(255,255,255,.1);color:var(--text);font:800 1.125rem/1 var(--font-body);padding:0}
.btn.step:not(:disabled):active{background:rgba(255,255,255,.22)}
.btn.step:disabled{opacity:.35;cursor:default}
.parts{min-width:1.5rem;text-align:center;font:italic 900 1rem/1 var(--font-display);color:var(--yellow)}

/* ---------- amount: a field and a slider for the USDC to spend ---------- */
.amount{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.125rem .75rem;background:rgba(6,7,28,.55);border:1px solid var(--line);border-radius:.875rem;padding:.5rem .75rem .375rem .5rem}
.amount .field{display:flex;align-items:center;gap:.375rem;height:2.5rem;padding:0 .625rem;border-radius:.625rem;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.amount .field:focus-within{border-color:var(--yellow)}
.amount .field input{width:3.25rem;min-width:0;border:0;padding:0;background:none;color:#fff;font:800 1.0625rem/1 var(--font-mono);text-align:right;outline:0;-moz-appearance:textfield;appearance:textfield}
.amount .field input::-webkit-outer-spin-button,.amount .field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount .field span{color:var(--muted);font:600 .75rem/1 var(--font-mono)}
.amount .slide{display:flex;flex-direction:column;min-width:0}
.amount input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1.75rem;margin:0;background:transparent;cursor:pointer;--fill:50%}
.amount input[type=range]::-webkit-slider-runnable-track{height:.5rem;border-radius:999px;background:linear-gradient(90deg,var(--yeet-deep),var(--yeet) var(--fill),rgba(255,255,255,.14) var(--fill))}
.amount input[type=range]::-moz-range-track{height:.5rem;border-radius:999px;background:linear-gradient(90deg,var(--yeet-deep),var(--yeet) var(--fill),rgba(255,255,255,.14) var(--fill))}
.amount input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.5rem;height:1.5rem;margin-top:-.5rem;border-radius:50%;background:var(--yeet);border:2px solid var(--ink);box-shadow:0 0 0 3px rgba(34,226,122,.28);transition:transform var(--dur-press) var(--ease-out)}
.amount input[type=range]::-moz-range-thumb{width:1.25rem;height:1.25rem;border-radius:50%;background:var(--yeet);border:2px solid var(--ink);box-shadow:0 0 0 3px rgba(34,226,122,.28)}
.amount input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.amount input[type=range]:disabled{opacity:.45;cursor:default}
.amount .ends{display:flex;justify-content:space-between;color:var(--muted);font:600 .6875rem/1 var(--font-mono);padding:0 .125rem}

.totals{display:flex;flex-wrap:wrap;gap:.25rem .875rem;font-size:.8125rem;color:var(--muted)}
.totals span:first-child{color:var(--text);font-weight:700}
.cost.high{color:var(--yellow);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.375rem}
.chip{display:inline-flex;align-items:center;gap:.375rem;font-size:.75rem;font-weight:700;padding:.1875rem .625rem .1875rem .25rem;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted)}
.chip.plain{padding-left:.625rem}
.chip.up{color:var(--up)}.chip.down{color:var(--down)}
.inline-error{display:flex;flex-direction:column;gap:.125rem;font-size:.8125rem;padding:.5rem .625rem;border-radius:.75rem;background:rgba(255,77,141,.1);border:1px solid rgba(255,77,141,.4)}
.inline-error strong{color:#fff}
.inline-error span{color:var(--muted)}

/* ---------- buttons: YEET green, SKEET pink, yellow for the brand's own calls ---------- */
.actions{display:flex;gap:.5rem;align-items:stretch;flex-wrap:wrap}
.btn{--f0:var(--yellow);--f1:var(--yellow-lift);--f2:#FFD41C;--gl:var(--glow-yellow);--rb:var(--yellow-deep);--ra:rgba(255,252,232,.95);
 position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:0;cursor:pointer;
 border-radius:var(--r-btn);color:var(--ink);font:italic 900 1.125rem/1 var(--font-display);letter-spacing:-.01em;text-decoration:none;white-space:nowrap;
 user-select:none;-webkit-user-select:none;background:var(--f0);transition:transform var(--dur-press) var(--ease-out),filter .2s,opacity .2s}
.btn:not(:disabled):active{transform:translateY(2px) scale(.985)}
.btn.yeet{--f0:var(--yeet);--f1:var(--yeet-lift);--f2:var(--yeet-deep);--gl:var(--glow-yeet);--rb:var(--yeet-deep);--ra:rgba(236,255,244,.95)}
.btn.skeet{--f0:var(--skeet);--f1:var(--skeet-lift);--f2:var(--skeet-deep);--gl:var(--glow-skeet);--rb:var(--skeet-deep);--ra:rgba(255,232,242,.95)}

.status{display:inline-flex;align-items:center;gap:.375rem;font-size:.75rem;font-weight:700}

.status.ok{color:var(--up)}.status.wait{color:var(--yellow)}.status.bad{color:var(--down)}

 const base=mark(el('li','row'),'row:usdc');base.append(coinChip('USDC'));const bw=el('div','who');bw.append(el('span','sym','USDC'),el('span','name','On Base, ready to YEET'));base.append(bw);
 const bv=el('div','est end');bv.append(el('span','amt',money(d.base?.usdc)??'—'));base.append(bv);list.append(base);
 const rows=(Array.isArray(d.solana?.holdings)?d.solana.holdings:[]).filter(h=>safeSymbol(h?.symbol)).slice(0,25);
 rows.sort((a,b)=>(Number(b.usd)||0)-(Number(a.usd)||0));
 for(const h of rows){
  const li=mark(el('li','row'),`row:${h.symbol}`);li.append(coinChip(h.symbol));
  const who=el('div','who');who.append(el('span','sym',h.symbol));const n=coinName(h.symbol);if(n)who.append(el('span','name',n));li.append(who);
  const est=el('div','est end');est.append(el('span','amt',amount(h.amount)??'—'),el('span','usd',money(h.usd)??'No price'));li.append(est);
  if(canCall()){
   // Two actions per coin, side by side: YEET more buys it again, SKEET sells it.
   const pair=el('div','pair');
   const more=button('yeet small','YEET more',null);more.onclick=()=>yeetMore(h.symbol,more);more.setAttribute('aria-label',`YEET more ${h.symbol}`);
   const sell=button('skeet small','SKEET',null);sell.onclick=()=>skeet(h.symbol,sell);sell.setAttribute('aria-label',`SKEET ${h.symbol}`);
   pair.append(more,sell);li.append(pair);
  }
  list.append(li);
 }
 card.append(list);
 if(!rows.length)card.append(el('p','note','No coins yet. Type @yeet me a win in the chat.'));
 const scene=shareScene();
 if(scene){const acts=mark(el('div','actions'),'actions');acts.append(shareButton());card.append(acts);if(shareOpen)card.append(sharePanel(scene))}
 if(note)card.append(noteLine(note));
 const when=clock(d.priced_at);if(when)card.append(el('p','fine',`Prices as of ${when}`));
 return card;
}
function renderLeaderboard(d){
 const card=el('section','card leaderboard');card.append(head('Leaderboard','XP'));
 const list=el('ol','lb');
 (Array.isArray(d.rows)?d.rows:[]).slice(0,50).forEach((r,i)=>{
  const top=Number.isInteger(r.rank)&&r.rank<=3;
  const li=mark(el('li',top?'lr top':'lr'),`lr:${i}`);const av=el('span',`av${i%6?` g${i%6}`:''}`);av.setAttribute('aria-hidden','true');if(r.rank===1)av.append(icon('crown'));
  li.append(el('span','rk',Number.isInteger(r.rank)?String(r.rank):'—'),av,el('span','nm',typeof r.name==='string'?r.name.slice(0,32):'—'),el('span','pts',Number.isInteger(r.xp)?`${r.xp.toLocaleString('en-US')} XP`:'—'));list.append(li);
 });
 card.append(list);
 const me=d.me||{};const mine=mark(el('div','lb'),'me');
 const row=el('div','lr me');const av=el('span','av');av.setAttribute('aria-hidden','true');av.append(icon('bolt'));
 row.append(el('span','rk',Number.isInteger(me.rank)?String(me.rank):'—'),av,el('span','nm',Number.isInteger(me.rank)?'You':'You · not ranked yet'),el('span','pts',`${Number.isInteger(me.xp)?me.xp.toLocaleString('en-US'):0} XP`));
 const gap=el('div','gap','· · ·');gap.setAttribute('aria-hidden','true');mine.append(gap,row);card.append(mine);
 return card;
}
const REFRESHABLE=new Set(['REQUOTE_REQUIRED','CONFIRMATION_REQUIRED','COST_TOO_HIGH','TEMPORARILY_UNAVAILABLE']);
function renderError(d,proposal_id){
 const code=typeof d?.error==='string'&&Object.hasOwn(ERRORS,d.error)?d.error:'TEMPORARILY_UNAVAILABLE';const [title,body,retryable]=ERRORS[code];
 const card=el('section','card problem');card.dataset.code=code;card.setAttribute('role','alert');
 card.append(display('h1',title),el('p',null,body));
 const fund=code==='BALANCE_LOW'?fundUrl(d.fund_url):null;
 if(fund)card.append(fundButton(fund));
 const pid=proposal_id||state.proposal_id;
 if(retryable&&REFRESHABLE.has(code)&&pid&&canCall())card.append(button('quiet','Refresh quote',()=>refresh(pid)));
 if(note)card.append(noteLine(note));
 return card;
}
// ---- Render: every card enters with an animation, changed parts tick, and what leaves fades out ------------------
const clockS=()=>(((window.performance?.now?.()??0)/1000)%3600).toFixed(2);
const STARS=[[64,22,9,5.2,-1.4,'#FFFFFF'],[72,64,6,4.4,-3.1,'#FFE03A'],[56,10,5,6.1,-.6,'#FFFFFF'],[68,84,7,5.6,-4.2,'#FFFFFF']];
/** Adds the card's trim (stars, the light on the top edge) and numbers its parts for the staggered entrance. */
function dress(card){
 const stars=el('div','stars');stars.setAttribute('aria-hidden','true');
 for(const [x,y,s,t,dl,c] of STARS){const i=el('i','tw');i.style.cssText=`--x:${x}%;--y:${y}%;--s:${s}px;--t:${t}s;--dl:${dl}s;--c:${c}`;stars.append(i)}
 const edge=el('div','edge-line');edge.setAttribute('aria-hidden','true');
 let i=0;for(const child of [...card.children]){child.style.setProperty('--i',String(i));i+=1;
  if(child.matches('.rows,.lb')){let j=0;for(const li of child.children){li.style.setProperty('--i',String(i-1));li.style.setProperty('--j',String(j));j+=1}i+=Math.min(j,4)}}
 card.prepend(stars,edge);
}
function fadeOut(node,frames,after){
 let a=null;try{a=node.animate(frames,{duration:260,easing:'cubic-bezier(.6,0,.9,.4)',fill:'forwards'})}catch{/* no animation here */}
 const done=()=>{node.remove();after?.()};
 if(a&&typeof a.finished?.then==='function')a.finished.then(done,done);else done();
}
/** A copy of something that just left the card, to animate out. Never a live control: no roles, keys, ids or focus. */
function copyOf(node,cls){
 const g=node.cloneNode(true);g.classList.remove('enter','in','tick');g.classList.add(cls);g.setAttribute('aria-hidden','true');g.inert=true;
 for(const n of [g,...g.querySelectorAll('[data-role],[data-k],[id]')]){n.removeAttribute('data-role');n.removeAttribute('data-k');n.removeAttribute('id')}
 return g;
}
function leavers(old,card){
 const keep=new Set([...card.querySelectorAll('[data-k]')].map(n=>n.dataset.k));
 for(const o of old.querySelectorAll('[data-k]')){
  if(keep.has(o.dataset.k))continue;
  const parent=o.parentElement,target=parent===old?card:parent?.matches?.('.rows')&&parent.parentElement===old?card.querySelector('.rows'):null;
  const h=o.getBoundingClientRect().height;if(!target||!(h>0))continue;
  let next=o.nextElementSibling,before=null;
  while(next&&!before){if(next.dataset?.k&&keep.has(next.dataset.k))before=[...target.children].find(n=>n.dataset.k===next.dataset.k)??null;next=next.nextElementSibling}
  const g=copyOf(o,'going');g.style.minHeight='0';target.insertBefore(g,before);
  const gap=parseFloat(window.getComputedStyle(target).rowGap)||0;
  fadeOut(g,[{opacity:1,height:`${h}px`,marginBottom:'0px'},{opacity:0,height:'0px',marginBottom:`${-gap}px`,paddingTop:'0px',paddingBottom:'0px'}],reportHeight);
 }
}
function render(){
 let node;const kind=!current||current.kind==='waiting'?'waiting':current.kind;
 if(kind==='waiting')node=el('p','waiting',WAITING[VIEW]??'Loading…');
 else try{
  node=current.kind==='basket'?renderBasket(current.data):current.kind==='receipt'?renderReceipt(current.data):current.kind==='home'?renderHome(current.data)
   :current.kind==='portfolio'?renderPortfolio(current.data):current.kind==='leaderboard'?renderLeaderboard(current.data):current.kind==='spin'?renderSpin(current.data)
   :renderError(current.data,current.proposal_id);
 }catch{node=renderError({error:'TEMPORARILY_UNAVAILABLE'})}
 if(kind!=='basket')basketUi=null;
 const old=[...root.children].find(c=>!c.classList.contains('ghost'))??null;
 const ghosts=[...root.children].filter(c=>c.classList.contains('ghost'));
 const moving=!REDUCED&&!!old&&old.getBoundingClientRect().height>0;
 const keys=new Map([...node.querySelectorAll('[data-k]')].map(n=>[n.dataset.k,n.textContent]));
 root.style.setProperty('--clk',clockS());
 if(node.matches('.card'))dress(node);
 if(kind!==lastKind){
  node.classList.add('enter');
  if(moving){const g=copyOf(old,'ghost');ghosts.push(g);fadeOut(g,[{opacity:1,transform:'none'},{opacity:0,transform:'translateX(16px) skewX(-4deg)'}])}
 }else{
  for(const n of node.querySelectorAll('[data-k]')){const k=n.dataset.k;if(!prevKeys.has(k))n.classList.add('in');else if(n.dataset.t&&prevKeys.get(k)!==n.textContent)n.classList.add('tick')}
  if(moving)leavers(old,node);
 }
 lastKind=kind;prevKeys=keys;
 root.replaceChildren(node,...ghosts);reportHeight();
 if(shareOpen&&moving){const p=node.querySelector('.share-panel');p?.scrollIntoView?.({block:'nearest',behavior:'smooth'})}
}

// ---- Wiring ------------------------------------------------------------------------------------
window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;const msg=event.data;if(!msg||msg.jsonrpc!=='2.0')return;
 if(!has(msg,'method')&&(has(msg,'result')||has(msg,'error'))&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);window.clearTimeout(p.timer);msg.error?p.reject(msg.error):p.resolve(msg.result);return}
 if(msg.method==='ping'&&has(msg,'id'))window.parent.postMessage({jsonrpc:'2.0',id:msg.id,result:{}},'*');
 if(msg.method==='ui/notifications/tool-result'){const p=msg.params||{};receive(p.structuredContent,p._meta,p.isError===true,p)}
 if(msg.method==='ui/notifications/host-context-changed'&&msg.params?.safeAreaInsets)applyInsets(msg.params.safeAreaInsets);
 if(msg.method==='ui/notifications/tool-cancelled'&&!current){lastKind='cancelled';root.replaceChildren(el('p','note','Cancelled.'));reportHeight()}
});
window.addEventListener('openai:set_globals',event=>{
 const g=event.detail?.globals;if(!g)return;if(g.safeArea)applyInsets(g.safeArea.insets);
 if(has(g,'toolOutput'))receive(g.toolOutput,g.toolResponseMetadata??window.openai?.toolResponseMetadata,false);
});
if(typeof window.ResizeObserver==='function')new window.ResizeObserver(reportHeight).observe(root);
if(window.openai){if(window.openai.safeArea)applyInsets(window.openai.safeArea.insets);if(window.openai.toolOutput!==undefined&&window.openai.toolOutput!==null)receive(window.openai.toolOutput,window.openai.toolResponseMetadata,false)}
if(!current&&state.trade_id&&VIEW==='receipt'&&canCall()){current={kind:'receipt',data:{trade_id:state.trade_id,status:'submitted',legs:[]}};poll(0)}
render();
if(window.parent!==window)request('ui/initialize',{appInfo:{name:'YEET',version:'1.0.0'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'}).then(r=>{
 host.ready=true;const caps=r?.hostCapabilities;host.canOpen=!!caps?.openLinks;host.canCallTools=!!caps?.serverTools;
 if(r?.hostContext?.safeAreaInsets)applyInsets(r.hostContext.safeAreaInsets);
 notify('ui/notifications/initialized');lastHeight=-1;
 if(current?.kind==='receipt'&&!FINAL.has(current.data.status))poll(POLL_MS);
 render();
}).catch(()=>{/* window.openai, when present, still serves the card. */});
})(window);
</script></body></html>
