<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YEET leaderboard</title>
<style>/* YEET cards. Colours follow the yeet.win landing page; system fonts only, nothing loaded from the network.
   Sizes are rem so a larger text size scales the card. Built for 320-480 px wide frames. */
:root{color-scheme:dark;
 --bg:#0b0814;--panel:#171127;--panel2:#211838;--line:#2e2450;--text:#f6f3ff;--muted:#bdb5d9;--dim:#8f86b3;
 --yellow:#ffe14d;--pink:#ff3d8b;--cyan:#3ee8ff;--lime:#9dff4f;--red:#ff6b6b;--ring:#3ee8ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:.9375rem;line-height:1.4;font-variant-numeric:tabular-nums}
main{padding:calc(.75rem + var(--host-top,0px)) calc(.75rem + var(--host-right,0px)) calc(.75rem + var(--host-bottom,0px)) calc(.75rem + var(--host-left,0px))}
p{margin:0}
h1{margin:0;font-size:1.125rem;font-weight:850;letter-spacing:-.01em}
ul,ol{list-style:none;margin:0;padding:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:1.125rem;padding:.875rem;display:flex;flex-direction:column;gap:.75rem;min-width:0}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.head .sub{color:var(--muted);font-size:.8125rem;font-weight:600}
.waiting{color:var(--muted);padding:.5rem 0}
.note{color:var(--muted);font-size:.8125rem}
.fine{color:var(--dim);font-size:.75rem}
.big{font-size:2rem;font-weight:900;color:var(--yellow)}

/* Rows: letter avatar, symbol over name, estimate, then the control on the right. */
.rows{display:flex;flex-direction:column;gap:.375rem}
.row{display:grid;grid-template-columns:2.25rem minmax(0,1fr) auto auto;align-items:center;gap:.5rem;background:var(--panel2);border-radius:.875rem;padding:.5rem .5rem .5rem .5rem;min-height:3.25rem}
.row .reason{grid-column:2/-1;color:var(--muted);font-size:.75rem}
.avatar{width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1rem;color:#0b0814;background:var(--yellow)}
.avatar[data-tone="1"]{background:var(--pink)}.avatar[data-tone="2"]{background:var(--cyan)}.avatar[data-tone="3"]{background:var(--lime)}
.avatar[data-tone="4"]{background:#b18cff}.avatar[data-tone="5"]{background:#ffb02e}
.who{display:flex;flex-direction:column;min-width:0}
.sym{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name{color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est{display:flex;flex-direction:column;align-items:flex-end;text-align:right;white-space:nowrap;font-size:.8125rem}
.est .amt{font-weight:700}
.est .usd,.est.muted{color:var(--muted);font-size:.75rem}
.row>.est:last-child{grid-column:3/-1}

.stepper{display:flex;align-items:center;gap:.125rem;background:#0f0a1c;border-radius:999px;padding:.125rem}
.btn.step{width:2rem;height:2rem;border-radius:50%;border:0;background:var(--panel2);font-size:1.125rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.btn.step:not(:disabled):active{background:var(--line)}
.btn.step:disabled{opacity:.35;cursor:default}
.parts{min-width:1.375rem;text-align:center;font-weight:900;color:var(--yellow)}

.totals{display:flex;flex-wrap:wrap;gap:.25rem .875rem;font-size:.8125rem;color:var(--muted)}
.totals span:first-child{color:var(--text);font-weight:700}
.cost.high{color:var(--yellow);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.375rem}
.chip{font-size:.75rem;padding:.125rem .5rem;border-radius:999px;background:var(--panel2);color:var(--muted)}
.chip.up{color:var(--lime)}.chip.down{color:var(--red)}
.inline-error{display:flex;flex-direction:column;gap:.125rem;font-size:.8125rem;padding:.5rem .625rem;border-radius:.75rem;background:#2a1030;border:1px solid #5a1d4a}
.inline-error span{color:var(--muted)}

.actions{display:flex;gap:.5rem;align-items:stretch;flex-wrap:wrap}
.btn{border:0;cursor:pointer}
.btn.primary{flex:1 1 10rem;min-height:3rem;border-radius:999px;font-size:1.25rem;font-weight:900;letter-spacing:.02em;color:#0b0814;
 background:linear-gradient(90deg,var(--yellow),#ffb02e 50%,var(--pink));box-shadow:0 6px 22px rgba(255,61,139,.3);transition:transform .12s ease,box-shadow .2s,opacity .2s}
.btn.primary.skeet{background:linear-gradient(90deg,var(--cyan),#b18cff);box-shadow:0 6px 22px rgba(62,232,255,.25)}
.btn.primary:not(:disabled):active{transform:scale(.98)}
.btn.primary:disabled{opacity:.4;box-shadow:none;cursor:default;filter:grayscale(.5)}
.btn.quiet{flex:0 1 auto;min-height:3rem;padding:0 1rem;border-radius:999px;background:transparent;border:1.5px solid var(--line);color:var(--text);font-weight:700}
.btn.skeet.small{min-height:2rem;padding:0 .75rem;border-radius:999px;font-size:.75rem;font-weight:900;color:#0b0814;background:var(--cyan)}
.btn.skeet.small:disabled{opacity:.4}

.status{font-size:.75rem;font-weight:700}
.status.ok{color:var(--lime)}.status.wait{color:var(--yellow)}.status.bad{color:var(--red)}
.links{display:flex;gap:.5rem;justify-content:flex-end}
.tx{color:var(--cyan);font-size:.75rem;font-weight:700;text-decoration:none}
.tx:hover{text-decoration:underline}
.got{display:flex;flex-wrap:wrap;gap:.25rem .75rem;align-items:baseline}
.got .label{color:var(--muted);font-size:.8125rem;flex-basis:100%}
.got strong{color:var(--lime)}
.xp{color:var(--yellow);font-weight:800;font-size:.875rem}
.receipt[data-status=success] h1{color:var(--lime)}
.receipt[data-status=failed] h1,.receipt[data-status=refunded] h1{color:var(--red)}

.xpbox{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.625rem;background:var(--panel2);border-radius:.875rem;padding:.5rem .625rem}
.xpnum{font-weight:900;color:var(--yellow)}
.streak{color:var(--muted);font-size:.8125rem}
.xpbox .btn.quiet{min-height:2.25rem}
.wheel{width:1.75rem;height:1.75rem;border-radius:50%;flex:none;background:conic-gradient(var(--yellow) 0 60deg,var(--pink) 0 120deg,var(--cyan) 0 180deg,var(--lime) 0 240deg,#b18cff 0 300deg,#ffb02e 0)}
.spinning .wheel{animation:turn .6s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}

/* Daily spin: the wheel box is square; wheel.css sizes the wheel inside it. */
.spin{display:flex;flex-direction:column;gap:.5rem}
.spin-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.spin-head h2{margin:0;font-size:1rem;font-weight:850}
.btn.quiet.small{min-height:2rem;padding:0 .75rem;font-size:.75rem}
.spin-wheel{position:relative;width:100%;max-width:24rem;aspect-ratio:1;margin:0 auto}
.spin-line{text-align:center;color:var(--muted);font-weight:700}
.spin-line.won{color:var(--yellow);font-size:1.25rem;font-weight:900}
.spin .fine{text-align:center}
display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:2.75rem minmax(0,1fr) auto;gap:.5rem;padding:.375rem .25rem;border-bottom:1px solid var(--line)}
.line:nth-child(-n+3) .rank{color:var(--yellow)}
.rank{font-weight:800;color:var(--muted)}
.who-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-weight:700}
.me{font-weight:800;color:var(--cyan)}

.problem{border-color:#5a1d4a}
.problem h1{color:var(--pink)}
.problem p{color:var(--muted)}
.problem .btn.quiet{align-self:flex-start}

@media (max-width:360px){
 .card{padding:.625rem}
 .row{grid-template-columns:2rem minmax(0,1fr) auto auto;gap:.375rem;padding:.375rem}
 .avatar{width:2rem;height:2rem;font-size:.875rem}
 .btn.step{width:1.75rem;height:1.75rem}
 .name{display:none}
 /* Rows with a control on the right: the estimate moves under the symbol so the symbol keeps its width. */
 .row:has(>.stepper),.row:has(>.btn){grid-template-columns:2rem minmax(0,1fr) auto;row-gap:0}
 .row:has(>.stepper)>.avatar,.row:has(>.btn)>.avatar{grid-row:1/3}
 .row:has(>.stepper)>.est,.row:has(>.btn)>.est{grid-column:2;grid-row:2;flex-direction:row;align-items:baseline;gap:.375rem;justify-content:flex-start}
 .row:has(>.stepper)>.stepper,.row:has(>.btn)>.btn{grid-column:3;grid-row:1/3}
}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
}
/* The XP wheel (src/wheel.js). The stage fills a sized box; the wheel sizes itself into it, leaving room for the end zoom. */
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wheel-stage{--win:#f6cf5a;--bulb:#fff1c4;--slice-deg:30deg;position:absolute;inset:0;overflow:visible;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wheel-ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.wheel-rays{position:absolute;left:var(--wheel-x,50%);top:var(--wheel-y,50%);width:1600px;height:1600px;margin:-800px 0 0 -800px;border-radius:50%;opacity:.32;
 background:repeating-conic-gradient(from 0deg,rgba(255,214,120,.16) 0deg 6deg,rgba(255,214,120,0) 6deg 18deg);
 -webkit-mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);mask:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);
 animation:wheel-rays 60s linear infinite;transition:opacity 1.2s}
@keyframes wheel-rays{to{transform:rotate(360deg)}}
.wheel-stage.st-spin .wheel-rays,.wheel-stage.st-free .wheel-rays{opacity:.18}
.wheel-stage.tense .wheel-rays{opacity:.05}
.wheel-stage.st-won .wheel-rays{opacity:.55;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--win) 35%,transparent) 0deg 6deg,transparent 6deg 18deg);animation-duration:22s}
/* The darkening at the end: everything but the wheel. */
.wheel-vignette{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.6s;
 background:radial-gradient(circle at var(--wheel-x,50%) var(--wheel-y,50%),transparent calc(var(--wheel-size,600px)*.5),rgba(0,0,0,.72) calc(var(--wheel-size,600px)*1.05))}
.wheel-stage.tense .wheel-vignette{opacity:1}
.wheel-wrap{position:absolute;z-index:5;transform-origin:50% 7%;transition:transform 1.6s cubic-bezier(.45,0,.2,1);touch-action:none}
.wheel-stage.tense .wheel-wrap{transform:scale(var(--wheel-zoom,1.12))}
.wheel-stage.st-won .wheel-wrap{transition:transform .9s cubic-bezier(.2,.9,.25,1)}
.wheel-wrap.grabbing{cursor:grabbing}
.wheel-halo{position:absolute;inset:-4%;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(246,207,90,.28) 52%,rgba(246,207,90,0) 70%);transition:opacity .8s}
.wheel-stage.st-won .wheel-halo{background:radial-gradient(circle,color-mix(in srgb,var(--win) 55%,transparent) 50%,transparent 70%);animation:wheel-halo 1.4s ease-in-out infinite}
@keyframes wheel-halo{50%{opacity:.55}}
.wheel-rotor{position:absolute;border-radius:50%;will-change:transform;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 2px rgba(0,0,0,.35)}
.wheel-rotor canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.wheel-blur{opacity:0}
.wheel-spot{position:absolute;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .5s;
 background:conic-gradient(from calc(var(--slice-deg)/-2),rgba(4,2,10,0) 0deg var(--slice-deg),rgba(4,2,10,.66) var(--slice-deg) 360deg)}
.wheel-stage.st-won .wheel-spot{opacity:1;transition-delay:.15s}
.wheel-wedge{position:absolute;pointer-events:none;opacity:0;overflow:visible}
.wheel-wedge path{fill:none;stroke:#fff;stroke-width:.018;stroke-linejoin:round;filter:drop-shadow(0 0 .02px #fff)}
.wheel-stage.st-won .wheel-wedge{opacity:1;animation:wheel-wedge 1.1s ease-in-out infinite;transition:opacity .4s .15s}
@keyframes wheel-wedge{50%{opacity:.55}}
.wheel-bulb{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 35%,#fff 0%,#6b5a3a 55%,#2a2114 100%);opacity:.55;transition:opacity .05s}
.wheel-bulb.on{opacity:1;background:radial-gradient(circle at 35% 35%,#fff 0%,var(--bulb) 40%,color-mix(in srgb,var(--bulb) 60%,#000) 100%);box-shadow:0 0 10px 2px color-mix(in srgb,var(--bulb) 80%,transparent),0 0 26px 6px color-mix(in srgb,var(--bulb) 35%,transparent)}
.wheel-stage.st-won{--bulb:var(--win)}
.wheel-flapper{position:absolute;pointer-events:none;transform-origin:50% 20%;will-change:transform;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.wheel-flapper svg{display:block;width:100%;height:100%;overflow:visible}
.wheel-hub{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;border:0;border-radius:50%;cursor:pointer;
 background:radial-gradient(circle at 50% 35%,#3a2160 0%,#1a0c30 70%);color:#fff;font:inherit;font-weight:800;letter-spacing:.08em;line-height:1;
 box-shadow:0 0 0 6px #c99a2e,0 0 0 9px #7a520f,0 0 0 11px #f7d774,0 10px 30px rgba(0,0,0,.6),inset 0 6px 18px rgba(255,255,255,.18)}
.wheel-hub:disabled{cursor:default;opacity:1}
.wheel-hub-main{font-size:var(--hubfs,30px)}
.wheel-hub-sub{font-size:calc(var(--hubfs,30px)*.42);letter-spacing:.12em;opacity:.8;margin-top:4px}
.wheel-hub-sub:empty{display:none}
.wheel-stage.st-ready .wheel-hub:not(:disabled){animation:wheel-hubpulse 1.8s ease-in-out infinite}
@keyframes wheel-hubpulse{50%{box-shadow:0 0 0 6px #c99a2e,0 0 0 9px #7a520f,0 0 0 11px #f7d774,0 0 40px 10px rgba(246,207,90,.55),inset 0 6px 18px rgba(255,255,255,.18)}}
.wheel-stage.st-won .wheel-hub{background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--win) 75%,#fff) 0%,var(--win) 55%,color-mix(in srgb,var(--win) 55%,#000) 100%);color:var(--winink,#fff)}
.wheel-fx{position:fixed;inset:0;z-index:15;width:100%;height:100%;pointer-events:none}
.wheel-flash{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--wheel-x,50%) var(--wheel-y,30%),rgba(255,255,255,.9),rgba(255,255,255,0) 60%)}
.wheel-flash.go{animation:wheel-flash .7s ease-out}
@keyframes wheel-flash{0%{opacity:.85}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.wheel-rays{animation:none!important}}

<script>(function yeetCard(window){
'use strict';
// One runtime for every YEET card. build.mjs stamps the view, the error copy and the coin names per template.
// Rendering uses textContent only. The one-time confirm code lives in one closure variable and nowhere else.
const document=window.document;
const VIEW="leaderboard";
const ERRORS={"INVALID_ARGUMENT":["Check the request","A value in the request is not valid, so check the coins, parts and amount.",false],"COIN_NOT_SUPPORTED":["Coin not available","One of these coins can’t be traded on YEET right now, so pick another from the coin list.",false],"PARTS_NOT_TEN":["Parts must add up to 10","Give each coin whole parts so the basket adds up to exactly 10.",false],"AMOUNT_TOO_SMALL":["Amount too small","Each coin needs at least the minimum per coin, so raise the amount or use fewer coins.",false],"COST_TOO_HIGH":["Fees too high right now","Swap costs for this basket are above the YEET limit, so try a larger amount or fewer coins.",true],"LIMIT_EXCEEDED":["Over your limit","This trade would go over the per-trade or daily USDC limit.",false],"BALANCE_LOW":["Not enough funds","Your YEET wallet doesn’t hold enough for this trade, so add funds or lower the amount.",false],"WALLET_NOT_READY":["Wallet not ready","Your YEET wallet isn’t set up for trading yet, so finish sign-in and try again.",false],"CONFIRMATION_REQUIRED":["Tap to confirm","Trades only run from your tap in the card, so refresh the quote and tap again.",true],"REQUOTE_REQUIRED":["Price moved","The price moved past your minimum, so refresh the quote to see the new numbers.",true],"TRADING_PAUSED":["Trading is paused","YEET has paused trading for now and your funds stay in your wallet.",true],"REAUTH_REQUIRED":["Reconnect YEET","ChatGPT needs your permission again, so reconnect YEET when it asks.",false],"TEMPORARILY_UNAVAILABLE":["Try again in a minute","YEET couldn’t reach a service it needs and nothing was traded.",true]};
const COINS={"USDC":"USD Coin (Solana)","SOL":"Solana","WIF":"dogwifhat","BOME":"BOOK OF MEME","TRUMP":"Official Trump","PENGU":"Pudgy Penguins","MELANIA":"Official Melania Meme","SPX":"SPX6900","TURBO":"Turbo","LOUD":"Loud","NEARKAT":"NearKat"};
const SPIN={"base_xp":5,"streak_bonus_xp":25,"bonus_xp":[0,2,5,7,9,12,15,19,24,31,40]};
const Wheel=(function yeetWheelFactory(window){
'use strict';
// The XP wheel: a sprung flapper over rim pegs, a slow end with a zoom, a heartbeat and a held breath,
// a snap to the slice's centre, then the slice lit and a fanfare sized to the prize.
// The server draws; this only moves to the slice it was given. Plain DOM, canvas and Web Audio: no
// libraries, no files, no network. This file is one function expression, called with a window.
const document=window.document;
const rad=d=>d*Math.PI/180;

// ================= landing math, no DOM =================
// R is the wheel's clockwise rotation in degrees; the pointer is at 12 o'clock.
// Slice k spans [k * SLICE_DEG, (k + 1) * SLICE_DEG) clockwise from the top of the unturned wheel.
/** Before the snap the pointer stops inside the drawn slice, this many degrees from one of its lines. */
const BAND=Object.freeze({min:0.6,max:2.4});
/** Deceleration: position = 1 - (1 - t)^p. */
const EASE_POWER=3.2;
/** Overshoot of the final snap to the slice's centre. */
const SNAP_BACK=1.25;
const MIN_TURNS=4;
const mod=(a,n)=>{const r=a%n;return r<0?r+n:r};
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,EASE_POWER);
const easeVelocity=t=>t<=0?EASE_POWER:t>=1?0:EASE_POWER*Math.pow(1-t,EASE_POWER-1);
function snapEase(t){if(t<=0)return 0;if(t>=1)return 1;const u=t-1;return 1+(SNAP_BACK+1)*u*u*u+SNAP_BACK*u*u}
/** Which side of the line and how far from it, from a uniform source in [0, 1). 'crossed': the pointer has just
 *  slipped over the line into the slice. 'shy': it stops just before the line out of it. */
function landingFor(unit){return {side:unit()<0.5?'crossed':'shy',distance:BAND.min+unit()*(BAND.max-BAND.min)}}
const rotationAt=(plan,seconds)=>plan.R0+plan.theta*ease(seconds/plan.duration);
/** p in [0, 1] through the snap. */
const snapAt=(plan,p)=>plan.Rstop+(plan.Rrest-plan.Rstop)*snapEase(p);

/** The geometry for a wheel of `count` equal slices. */
function geometry(count){
 if(!Number.isInteger(count)||count<2)throw Error('slice count');
 const SLICE_DEG=360/count;
 const pointerAngle=R=>mod(-R,360);
 const sliceAt=R=>Math.floor(pointerAngle(R)/SLICE_DEG)%count;
 /** Signed offset of the nearest line (peg) from the pointer; negative is still approaching. */
 const lineOffset=R=>mod(R+SLICE_DEG/2,SLICE_DEG)-SLICE_DEG/2;
 /** A rotation that rests with `slice` centred under the pointer. */
 const restRotation=slice=>-(slice*SLICE_DEG+SLICE_DEG/2);
 /** From rotation R0 at launch speed v0 (deg/s), at least four whole turns, to just inside `slice`, in about `targetDuration` seconds. */
 function planSpin({R0,slice,side,distance,v0,targetDuration}){
  const aStop=side==='crossed'?(slice+1)*SLICE_DEG-distance:slice*SLICE_DEG+distance;
  const aCenter=slice*SLICE_DEG+SLICE_DEG/2;
  const base=mod(mod(-aStop,360)-mod(R0,360),360);
  const turns=Math.max(MIN_TURNS,Math.round((v0*targetDuration/EASE_POWER-base)/360));
  const theta=base+360*turns;
  const Rstop=R0+theta;
  return {slice,side,distance,R0,theta,duration:EASE_POWER*theta/v0,v0,Rstop,Rrest:Rstop+(aStop-aCenter)};
 }
 return {count,SLICE_DEG,pointerAngle,sliceAt,lineOffset,restRotation,planSpin};
}

/** The end zoom. The stage is sized from it so the zoomed wheel never leaves the stage. */
const WHEEL_ZOOM=1.12;
/** The zoom's origin, as a fraction of the wheel box from the top: near the flapper, so the pointer stays put. */
const ZOOM_ORIGIN_Y=0.07;
/** How far the halo reaches past the wheel box, as a fraction of it; the flapper's overhang is inside this. */
const HALO=0.04;
/** The wheel box for a stage of w by h: its side, and where it sits, so that at full zoom the wheel, flapper and halo still fit, centred. */
function wheelFit(w,h,zoom=WHEEL_ZOOM){
 const width=(1+2*HALO)*zoom;
 const top=ZOOM_ORIGIN_Y-(ZOOM_ORIGIN_Y+HALO)*zoom;
 const bottom=ZOOM_ORIGIN_Y+(1+HALO-ZOOM_ORIGIN_Y)*zoom;
 const size=Math.max(0,Math.floor(Math.min(w/width,h/(bottom-top))));
 return {size,left:(w-size)/2,top:(h-(bottom-top)*size)/2-top*size,extent:{width:width*size,top,bottom}};
}

const DEFAULT_V0=1080;
const TARGET_S=10.5;
const WINDUP_MS=520;
const WINDUP_DEG=16;
const HOLD_MS=950;
const SNAP_MS=720;
const TENSE_S=3.6;
const BULBS=24;
const FONT='ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, Arial, sans-serif';

// ================= sound =================
const SOUND_KEY='yeet.wheel.sound';
function readSoundSetting(){try{return window.localStorage?.getItem(SOUND_KEY)!=='false'}catch{return true}}
/** The fanfare's rising notes, C5 up to E7: three for the smallest prize, one more per tier, eight for the top (tier 5). */
const FANFARE=[523.25,659.25,783.99,1046.5,1318.5,1567.98,2093,2637.02];

// ---- Daily spin: the wheel starts on the tap, the server draws, the wheel lands on the slice it names --------
const WHEEL_COLORS=[{color:'#ff3d8b',deep:'#8a0f4f',ink:'#ffffff'},{color:'#3ee8ff',deep:'#0a6378',ink:'#0b0814'},{color:'#9dff4f',deep:'#2f6b08',ink:'#0b0814'},
 {color:'#8b5cf6',deep:'#3f1f99',ink:'#ffffff'},{color:'#ff8a2e',deep:'#9a3a06',ink:'#0b0814'}];
const WHEEL_TOP={color:'#ffe14d',deep:'#a87a05',ink:'#3b2500'};
/** One slice per base + bonus value from the contract, small and large alternating round the wheel; tier 0..5 by size. */
const SLICES=(()=>{
 const base=Number.isInteger(SPIN?.base_xp)?SPIN.base_xp:0;
 const xp=[...new Set((Array.isArray(SPIN?.bonus_xp)?SPIN.bonus_xp:[]).filter(Number.isInteger).map(b=>base+b))].sort((a,b)=>a-b);
 if(xp.length<2)return [];
 const order=[];for(let lo=0,hi=xp.length-1;lo<=hi;lo+=1,hi-=1){order.push(xp[lo]);if(hi!==lo)order.push(xp[hi])}
 let k=0;
 return order.map(v=>{const rank=xp.indexOf(v);const tier=Math.round(rank*5/(xp.length-1));const top=rank===xp.length-1;
  return {xp:v,label:`+${v}`,sub:'XP',tier,...(top?WHEEL_TOP:WHEEL_COLORS[k++%WHEEL_COLORS.length])}});
})();
/** The slice for an award: base + bonus, or that plus the streak bonus, else the nearest value. */
function sliceFor(xpWon){
 let i=SLICES.findIndex(c=>c.xp===xpWon);if(i>=0)return {slice:i,streak:0};
 const bonus=Number.isInteger(SPIN?.streak_bonus_xp)?SPIN.streak_bonus_xp:0;
 i=SLICES.findIndex(c=>c.xp===xpWon-bonus);if(bonus&&i>=0)return {slice:i,streak:bonus};
 i=0;SLICES.forEach((c,k)=>{if(Math.abs(c.xp-xpWon)<Math.abs(SLICES[i].xp-xpWon))i=k});return {slice:i,streak:0};
}
const canWheel=()=>SLICES.length>=2&&typeof window.requestAnimationFrame==='function';
/** The wheel lives across renders: render() moves the same node, so the motion never restarts. */
function wheelNode(won){
 if(!wheel){
  wheelBox=el('div','spin-wheel');
  const at=won?sliceFor(won.xp_won).slice:null;
  try{wheel=Wheel.createWheel(wheelBox,{slices:SLICES,restSlice:at,won:!!won,canSpin:()=>canCall()&&!spinBusy&&!spinWon,onSpin:startSpin,onStopped:wheelStopped})}
  catch{wheelBox=null;return null}
  if(won)wheel.setHub(`+${won.xp_won}`,'XP');
 }
 return wheelBox;
}
async function startSpin(v0,windup){
 if(spinBusy||spinWon||!canCall()||!wheel||!wheel.start(v0,windup))return;
 spinBusy=true;note=null;wheel.setEnabled(false);wheel.setHub('','');render();
 let u;try{u=unwrap(await callTool('daily_spin',{}))}catch{u={data:{error:'TEMPORARILY_UNAVAILABLE'}}}
 if(kindOf(u.data)==='spin'){spinLanding=u.data;wheel.land(sliceFor(u.data.xp_won).slice);return}
 wheel.abort();spinBusy=false;wheel.setHub('SPIN','');wheel.setEnabled(true);
 note=ERRORS[u.data?.error]?.[0]??ERRORS.TEMPORARILY_UNAVAILABLE[0];render();
}
function wheelStopped(){
 const d=spinLanding;if(!d)return;spinLanding=null;spinBusy=false;

}

const usdFmt=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});

function amount(v){
 if(typeof v!=='string'||!DECIMAL.test(v))return null;const n=Number(v);if(!Number.isFinite(n))return null;
 const a=Math.abs(n);const opts=a>=1000?{maximumFractionDigits:0}:a>=1?{maximumFractionDigits:2}:{maximumSignificantDigits:4};
 return new Intl.NumberFormat('en-US',opts).format(n);
}
function pct(n){return typeof n==='number'&&Number.isFinite(n)?`${n.toFixed(n<10?1:0)}%`:null}
function shortAddr(a){return typeof a==='string'&&a.length>12?`${a.slice(0,6)}…${a.slice(-4)}`:a??''}
function clock(iso){const t=new Date(iso);return Number.isFinite(t.getTime())?new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit'}).format(t):null}
function safeSymbol(s){return typeof s==='string'&&SYMBOL.test(s)?s:null}
function coinName(s){return s&&Object.hasOwn(COINS,s)?COINS[s]:null}

function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&!u.username&&!u.password&&EXPLORERS.has(u.hostname)?u.href:null}catch{return null}}

window.addEventListener('message',event=>{
 if(event.source!==window.parent)return;const msg=event.data;if(!msg||msg.jsonrpc!=='2.0')return;
 if(!has(msg,'method')&&(has(msg,'result')||has(msg,'error'))&&pending.has(msg.id)){const p=pending.get(msg.id);pending.delete(msg.id);window.clearTimeout(p.timer);msg.error?p.reject(msg.error):p.resolve(msg.result);return}
 if(msg.method==='ping'&&has(msg,'id'))window.parent.postMessage({jsonrpc:'2.0',id:msg.id,result:{}},'*');
 if(msg.method==='ui/notifications/tool-result'){const p=msg.params||{};receive(p.structuredContent,p._meta,p.isError===true,p)}
 if(msg.method==='ui/notifications/host-context-changed'&&msg.params?.safeAreaInsets)applyInsets(msg.params.safeAreaInsets);
 if(msg.method==='ui/notifications/tool-cancelled'&&!current){root.replaceChildren(el('p','waiting','Cancelled.'));reportHeight()}
});

 const g=event.detail?.globals;if(!g)return;if(g.safeArea)applyInsets(g.safeArea.insets);
 if(has(g,'toolOutput'))receive(g.toolOutput,g.toolResponseMetadata??window.openai?.toolResponseMetadata,false);
