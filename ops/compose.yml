# YEET connector stack (port plan section 5). Written for Lane A; not started by Lane A.
# Values: non-secret settings come from ops/.env (copy env/compose.env.example; .env is git-ignored).
# Secret values live only in /var/lib/yeet-connector/config/<role>.env (see env/*.env.example for the names).
name: yeet-connector
x-runtime: &runtime
  image: yeet-connector:${YEET_IMAGE_TAG:-local}
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  mem_limit: 256m
  pids_limit: 64
services:
  bootstrap:
    <<: *runtime
    build: {context: .., dockerfile: ops/Dockerfile, args: {SERVER_COMMIT: '${YEET_IMAGE_TAG:-}'}}
    pull_policy: build
    command: [as/bootstrap.mjs]
    network_mode: none
    volumes: ['/var/lib/yeet-connector/secrets:/secrets']
  as:
    <<: *runtime
    restart: unless-stopped
    command: [as/server.mjs, as]
    environment:
      ISSUER: ${ISSUER:-}
      RESOURCE: ${RESOURCE:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      PUBLIC_MODE: ${PUBLIC_MODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ACCESS_TTL: ${ACCESS_TTL:-}
      # ChatGPT stays connected for 7 days (absolute, from the first refresh token; the person ticks "stay connected"
      # on the consent page), with the ChatGPT refresh compatibility and its diagnostics on.
      REFRESH_FAMILY_TTL: ${REFRESH_FAMILY_TTL:-604800}
      TEST_PROFILE: ${TEST_PROFILE:-}
      DEV_IDENTITY_STUB: ${DEV_IDENTITY_STUB:-}
      MOCK_PASSWORD_LOGIN: ${MOCK_PASSWORD_LOGIN:-}
      PRIVY_LOGIN: ${PRIVY_LOGIN:-}
      REFRESH_CONSENT_COMPAT: ${REFRESH_CONSENT_COMPAT:-1}
      REFRESH_DIAGNOSTICS: ${REFRESH_DIAGNOSTICS:-1}
      CIMD_TEST_FIXTURES: ${CIMD_TEST_FIXTURES:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_JWKS_URL: ${PRIVY_JWKS_URL:-}
      # Sign-in methods on pages with no account-bound link: comma list of google, apple, email. Default google,apple.
      YEET_LOGIN_METHODS: ${YEET_LOGIN_METHODS:-}
      # The email code right after a Google or Apple sign-in on the connect screen. Default on; 0 turns it off.
      YEET_SIGNUP_EMAIL_STEP: ${YEET_SIGNUP_EMAIL_STEP:-}
      STATE_DIR: /state
      CORE_INTERNAL: ${CORE_INTERNAL:-}
      YEET_DAILY_CAP_USDC: ${YEET_DAILY_CAP_USDC:-}
    env_file: [{path: /var/lib/yeet-connector/config/as.env, required: false}]
    ports: ['127.0.0.1:38860:38312']
    volumes: ['/var/lib/yeet-connector/as-state:/state', '/var/lib/yeet-connector/secrets/as:/secrets:ro']
    networks: [oauth, core]
    depends_on: {bootstrap: {condition: service_completed_successfully}, core: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "require('http').get({hostname:'127.0.0.1',port:38312,path:'/.well-known/openid-configuration',headers:{host:new URL(process.env.ISSUER).host}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"], interval: 2s, timeout: 2s, retries: 20}
  mcp:
    <<: *runtime
    restart: unless-stopped
    command: [mcp/server.mjs, mcp]
    environment:
      ISSUER: ${ISSUER:-}
      RESOURCE: ${RESOURCE:-}
      PUBLIC_MODE: ${PUBLIC_MODE:-}
      PRIVY_LOGIN: ${PRIVY_LOGIN:-}
      # Public Privy app id: trade results tell the card which Privy app signs (_meta['yeet/signer']).
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      AS_INTERNAL: ${AS_INTERNAL:-}
      CORE_INTERNAL: ${CORE_INTERNAL:-}
      YEET_P2: ${YEET_P2:-}
    env_file: [{path: /var/lib/yeet-connector/config/connector.env, required: false}]
    ports: ['127.0.0.1:38861:38313']
    volumes: ['/var/lib/yeet-connector/secrets/mcp:/secrets:ro']
    networks: [oauth, core]
    depends_on: {as: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "require('http').get({hostname:'127.0.0.1',port:38313,path:'/.well-known/oauth-protected-resource',headers:{host:new URL(process.env.RESOURCE).host}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"], interval: 2s, timeout: 2s, retries: 20}
  core:
    <<: *runtime
    restart: unless-stopped
    command: [core/server.mjs, core]
    environment:
      ISSUER: ${ISSUER:-}
      RESOURCE: ${RESOURCE:-}
      PRIVY_LOGIN: ${PRIVY_LOGIN:-}
      PRIVY_APP_ID: ${PRIVY_APP_ID:-}
      PRIVY_JWKS_URL: ${PRIVY_JWKS_URL:-}
      AS_INTERNAL: ${AS_INTERNAL:-}
      YEET_PRIVY_KEY_QUORUM_ID: ${YEET_PRIVY_KEY_QUORUM_ID:-}
      YEET_BASE_POLICY_ID: ${YEET_BASE_POLICY_ID:-}
      YEET_SOLANA_POLICY_ID: ${YEET_SOLANA_POLICY_ID:-}
      YEET_SIGNER: ${YEET_SIGNER:-}
      YEET_GAS_WALLET_ID: ${YEET_GAS_WALLET_ID:-}
      YEET_BASE_GAS: ${YEET_BASE_GAS:-}
      YEET_SOL_FEE_PAYER_ID: ${YEET_SOL_FEE_PAYER_ID:-}
      YEET_SOL_FEE_PAYER_ADDRESS: ${YEET_SOL_FEE_PAYER_ADDRESS:-}
      YEET_FEE_PAYER_SOL_FLOOR: ${YEET_FEE_PAYER_SOL_FLOOR:-}
      YEET_SOL_PRIORITY_MICRO_LAMPORTS: ${YEET_SOL_PRIORITY_MICRO_LAMPORTS:-}
      YEET_SOL_BATCH_MAX_LEGS: ${YEET_SOL_BATCH_MAX_LEGS:-}
      YEET_SPONSOR_DAILY_TX: ${YEET_SPONSOR_DAILY_TX:-}
      YEET_SPONSOR_DAILY_LAMPORTS: ${YEET_SPONSOR_DAILY_LAMPORTS:-}
      YEET_SPONSOR_GLOBAL_DAILY_LAMPORTS: ${YEET_SPONSOR_GLOBAL_DAILY_LAMPORTS:-}
      YEET_SPONSOR_MAX_FEE_LAMPORTS: ${YEET_SPONSOR_MAX_FEE_LAMPORTS:-}
      YEET_SPONSOR_DAILY_RENT_ACCOUNTS: ${YEET_SPONSOR_DAILY_RENT_ACCOUNTS:-}
      YEET_SPONSOR_GLOBAL_DAILY_RENT_LAMPORTS: ${YEET_SPONSOR_GLOBAL_DAILY_RENT_LAMPORTS:-}
      YEET_BUY_CHAIN: ${YEET_BUY_CHAIN:-}
      YEET_SELL_CHAIN: ${YEET_SELL_CHAIN:-}
      YEET_SOLANA_PAUSE: ${YEET_SOLANA_PAUSE:-}
      YEET_BASE_PAUSE: ${YEET_BASE_PAUSE:-}
      # Base gas wallet (just-in-time ETH top-up). The key file is mounted under /secrets, never in compose.
      YEET_BASE_GAS_WALLET: ${YEET_BASE_GAS_WALLET:-}
      YEET_BASE_GAS_WALLET_KEY_FILE: ${YEET_BASE_GAS_WALLET_KEY_FILE:-}
      YEET_BASE_TOPUP_CAP_RAW: ${YEET_BASE_TOPUP_CAP_RAW:-}
      YEET_BASE_TOPUP_GLOBAL_DAILY_RAW: ${YEET_BASE_TOPUP_GLOBAL_DAILY_RAW:-}
      YEET_BASE_GAS_FLOOR_RAW: ${YEET_BASE_GAS_FLOOR_RAW:-}
      YEET_BASE_MAX_FEE_WEI: ${YEET_BASE_MAX_FEE_WEI:-}
      YEET_BASE_TOPUP_REPLACE_MAX_FEE_WEI: ${YEET_BASE_TOPUP_REPLACE_MAX_FEE_WEI:-}
      # Base basket mode: unset or legacy = one signed transfer per coin plus an ETH top-up; 7702 = one EIP-7702
      # Calibur batch per basket that the gas wallet sends and pays (BASE-7702-PRODUCTION-PLAN.md). Off unless set.
      YEET_BASE_MODE: ${YEET_BASE_MODE:-}
      YEET_BASE_BATCH_MAX_COST_WEI: ${YEET_BASE_BATCH_MAX_COST_WEI:-}
      YEET_BASE_DEPOSIT_SEEN_MS: ${YEET_BASE_DEPOSIT_SEEN_MS:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_BROADCAST_RPC_URL: ${SOLANA_BROADCAST_RPC_URL:-}
      SOLANA_HISTORY_RPC_URL: ${SOLANA_HISTORY_RPC_URL:-}
      YEET_LIVE: ${YEET_LIVE:-}
      YEET_KILL_SWITCH: ${YEET_KILL_SWITCH:-}
      YEET_LIVE_ACCOUNTS: ${YEET_LIVE_ACCOUNTS:-}
      YEET_MAX_TRADE_USDC: ${YEET_MAX_TRADE_USDC:-}
      YEET_DAILY_CAP_USDC: ${YEET_DAILY_CAP_USDC:-}
      YEET_MIN_LEG_USDC: ${YEET_MIN_LEG_USDC:-}
      YEET_MIN_SKEET_USDC: ${YEET_MIN_SKEET_USDC:-}
      YEET_MAX_COST_BPS: ${YEET_MAX_COST_BPS:-}
      YEET_MAX_ACCOUNTS: ${YEET_MAX_ACCOUNTS:-}
      YEET_REQUOTE_TOLERANCE_BPS: ${YEET_REQUOTE_TOLERANCE_BPS:-}
      YEET_CODE_MINT_LIMIT: ${YEET_CODE_MINT_LIMIT:-}
      YEET_TRACK_MAX_HOURS: ${YEET_TRACK_MAX_HOURS:-}
      YEET_BALANCE_TOLERANCE_BPS: ${YEET_BALANCE_TOLERANCE_BPS:-}
      YEET_STUCK_AFTER_MINUTES: ${YEET_STUCK_AFTER_MINUTES:-}
      YEET_P2: ${YEET_P2:-}
      # Where the YEET terms are accepted: chat (default) or page (the /account/terms page). connector/core/terms.mjs.
      YEET_TERMS_MODE: ${YEET_TERMS_MODE:-}
      STATE_DIR: /state
    # Secret values (PRIVY_APP_SECRET, YEET_PRIVY_AUTHORIZATION_KEY, ONECLICK_JWT, YEET_XP_SECRET) only from this file.
    env_file: [{path: /var/lib/yeet-connector/config/core.env, required: false}]
    volumes: ['/var/lib/yeet-connector/core-state:/state', '/var/lib/yeet-connector/secrets/core:/secrets:ro']
    networks:
      core: {ipv4_address: 10.233.49.2}
      egress: {}
    depends_on: {bootstrap: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:38316/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 2s, timeout: 2s, retries: 20}
networks:
  oauth:
    ipam:
      config: [{subnet: 10.233.48.0/24, gateway: 10.233.48.1}]
  core:
    internal: true
    ipam:
      config: [{subnet: 10.233.49.0/24, gateway: 10.233.49.1}]
  # Core needs outbound HTTPS (1Click, Privy API, Base and Solana RPC); the AS reaches JWKS/CIMD over oauth.
  egress: {}
